法","text":"peak at 后接具体数值。"},{"k":"ex","label":"例句","text":"The number peaked at 60%."}]},{"id":"vx-recordhigh","title":"hit a record high","meta":"phr. 创历史新高","tags":["过去式 hit（不规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「历史最高」。"},{"k":"ex","label":"例句","text":"The figure hit a record high."}]},{"id":"vx-trough","title":"trough / hit the lowest point","meta":"n./phr. 谷底 / 最低点","tags":[],"blocks":[{"k":"note","label":"用法","text":"描述「最低点」。"},{"k":"ex","label":"例句","text":"The figure reached a trough in 2020."}]}]},{"id":"ve","name":"易错点速查","full":"词汇 · 易错点速查","group":"易错点","color":"#b5483c","icon":"<path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"/><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"/><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"/>","items":[{"id":"ve-rise","title":"rise vs raise","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"rise 不及物（价格 rose）；raise 及物（raise the price）。"},{"k":"ex","label":"例句","text":"Prices rose（对）/ The policy raised prices（对）."}]},{"id":"ve-accountfor","title":"account for","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"表「占比」用 account for；表「解释」也拼 account for，看语境。"},{"k":"ex","label":"例句","text":"Employment accounted for 45%（占比）."}]},{"id":"ve-byto","title":"increase by vs increase to","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"by 后接增长量，to 后接终值。"},{"k":"ex","label":"例句","text":"increased by 15%（增量）/ increased to 45%（终值）."}]},{"id":"ve-percentage","title":"percentage vs percent","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"percentage 是名词；percent 跟在数字后。"},{"k":"ex","label":"例句","text":"the percentage of A / 45 percent."}]},{"id":"ve-number","title":"number vs amount","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"number 接可数名词，amount 接不可数。"},{"k":"ex","label":"例句","text":"the number of students / the amount of time."}]},{"id":"ve-fewer","title":"fewer vs less","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"区分","text":"fewer 接可数复数，less 接不可数。"},{"k":"ex","label":"例句","text":"fewer students / less time."}]},{"id":"ve-tense","title":"时态","meta":"易错点","tags":[],"blocks":[{"k":"note","label":"提醒","text":"过去年份数据用一般过去时；预测趋势用将来时/一般现在时。"},{"k":"ex","label":"例句","text":"The figure rose（过去）/ This trend will continue（将来）."}]},{"id":"ve-pasttense","title":"过去式重点提醒","meta":"不规则动词速查","tags":[],"blocks":[{"k":"note","label":"不规则动词","text":"rise → rose → risen；grow → grew → grown；swell → swelled → swollen；dip → dipped；fall → fell → fallen；shrink → shrank → shrunk；leap → leaped / leaped。"}]}]}] },
  xiaozuowen: { key:'xiaozuowen', name:'小作文', sub:'通知 · 邀请 · 建议 · 介绍 · 回信', ls:'xiaozuowen_v1', blurEn:'句型', blurEx:'范文', noteLabel:'✎ 我的笔记（记忆点 / 替换词，自动保存）', data: [{"id":"f","name":"格式与卷面","full":"第一部分 · 格式与卷面要求","group":"框架","color":"#8a7a5f","icon":"<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/>","items":[{"id":"f-structure","title":"三段式结构","meta":"格式 · 作文纸共 24 行","tags":[],"blocks":[{"k":"en","label":"骨架","text":"Dear + 称呼，\n\n第一段：打招呼 + 目的（3-4 行）\n第二段：文章主体，分点（8-10 行）\n第三段：结尾、期待、补充（2-3 行）\n\nBest regards. / Yours faithfully,\nLi Ming"},{"k":"note","label":"提示","text":"拿空五格来说还有 19 行，非常足够。"}]},{"id":"f-format","title":"齐头式 · 字数","meta":"格式要求","tags":[],"blocks":[{"k":"note","label":"格式","text":"齐头式（左齐式）：顶格写，每写完一部分空一行。24/25/26 英一小作文卷面题目都是齐头式。"},{"k":"note","label":"字数","text":"要求 100 字，但那是底限不是上限——140 字左右、不超格子。"}]},{"id":"f-sizi","title":"思路四字诀","meta":"写作思路","tags":[],"blocks":[{"k":"en","label":"四字诀","text":"进入角色、联系常识、设定具体、礼貌情商。"},{"k":"note","label":"解读","text":"动笔前先想清楚：你是谁、对方是谁、常识里这件事怎么做、把抽象要求落到具体细节、措辞保持礼貌。"}]},{"id":"f-classify","title":"小作文分类一览","meta":"分类看主体段写什么，不看表象核心词","tags":[],"blocks":[{"k":"note","label":"建议信","text":"英一 24、21、17、14、12；英二 23'、20'、18'、16"},{"k":"note","label":"介绍类","text":"英一 26、25、23、19、16；英二 26、25、24、20'、19'、17、15、13"},{"k":"note","label":"原因/解释","text":"英一 15、11；英二 23'、19'、18'、14、12"},{"k":"note","label":"活动邀请","text":"英一 22、20、18、13"},{"k":"note","label":"活动通知","text":"英二 22、21"},{"k":"note","label":"分类方式","text":"看题目要求的哪个点可以拆分成多点来说。有些时候第一个要求点只是开头段的引出内容；哪个要求点能写出 2～3 个点，就是主体段、决定文章类型。例：16 英二表面是感谢信，实为建议信。双主体段：题目要求有两个可拆分成多点的点（如 23 英一、20 英二）。"}]},{"id":"f-punct","title":"标点规则","meta":"格式要求","tags":[],"blocks":[{"k":"note","label":"规则","text":"① 字母后，紧接着打标点；标点后，空一格再开始。② 每一个空格是一个字母，而不是空出一片天地！"}]},{"id":"f-writing","title":"字迹是 Game Changer","meta":"卷面 · 总体印象评分","tags":[],"blocks":[{"k":"note","label":"要点","text":"翻译、大小作文都按总体印象评分：根据第一印象给档分，再根据有限时间内看到的细节调整 2 分左右；很多老师改卷草率，字迹极其极其极其重要！"},{"k":"note","label":"五不要/要","text":"① 不要太大，更不要太小；② 不要连笔字和花体字；③ 要有「高低等分」意识；④ 字母间、词间均匀；⑤ 某些字母强化练习。"},{"k":"note","label":"易错字母","text":"尤其注意 l i v a t u r n：r 不要像 v；v 不要下端太圆；l 要直不要拖泥带水；i 要干净、a 要封口、t 要均衡。"},{"k":"note","label":"提醒","text":"有错误，画一线划掉即可。字差大小一起只给 6 分——老师扣分比你想象中狠多了。每天换脑子时间练字帖 15 分钟，一个月就会有神奇变化。"}]}]},{"id":"n","name":"通知 Notice","full":"第二部分 · 通知 Notice","group":"题型模板","color":"#5b7ca3","icon":"<path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"/>","items":[{"id":"n-format","title":"开头段 · 格式","meta":"通知/邀请通用 · 必背","tags":[],"blocks":[{"k":"en","label":"格式","text":"① Notice 第一行正中写：Notice；紧接下一行写：Dear fellow students/experts,\n② Email / Letter 题号后接着直接写：Dear Professor Smith/fellow students,"},{"k":"note","label":"注意","text":"Notice 只比 Email 多一个标题。不能因此把下面的正文全部改成另一套僵硬的公文写法。通知仍然是在对特定读者传递信息。"}]},{"id":"n-call","title":"开头段 · 称呼对象","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"面向学生","text":"Dear fellow students,"},{"k":"en","label":"面向多位专家","text":"Dear experts, / Dear professors and experts,"},{"k":"en","label":"面向某位教授","text":"Dear Professor Smith, / Dear Professor Wang,"},{"k":"note","label":"注意","text":"教授姓名题目给定则直接使用；未给姓名时，写 Dear Professor + 自编名。"}]},{"id":"n-greet","title":"开头段 · 礼貌开场","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"万能开场","text":"I hope this message finds you well!（中文也有：展信好）"},{"k":"en","label":"得知对方感兴趣","text":"I am delighted to learn that you are interested in our project."},{"k":"en","label":"正式告知好消息","text":"I am pleased to inform you that..."},{"k":"note","label":"注意","text":"I hope this message finds you well! 也可以用于有明确读者的 Notice。通知可以理解为贴在公共场所给一群读者的公开信，同样应当礼貌。"}]},{"id":"n-id","title":"开头段 · 介绍身份","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"万能学生会身份","text":"My name is Li Ming, the president of the Student Union."},{"k":"en","label":"具体协会负责人","text":"I am Li Ming, the head of the English Association."},{"k":"en","label":"活动负责人","text":"I am the coordinator of the ongoing/upcoming Campus Cultural Festival."},{"k":"en","label":"活动志愿者","text":"My name is Li Ming, a volunteer for Professor Smith's research project on campus sports activities."},{"k":"en","label":"对方认识你","text":"As the coordinator of the Campus Cultural Festival, I am delighted that you are interested in the event."},{"k":"note","label":"注意","text":"如果双方已经认识，或题目明确交代对方给你写信、认识你，不能机械重复 My name is Li Ming，直接说我正举行什么、谢谢你感兴趣。ongoing 正在举行的、upcoming 即将到来的。"}]},{"id":"n-activity","title":"开头段 · 点出活动","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"学校举办活动","text":"Our university is going to hold an English singing contest. / Our university is going to hold an anniversary celebration."},{"k":"en","label":"协会筹办活动","text":"Our association is planning to hold a reading campaign for first-year students."},{"k":"en","label":"展览内容","text":"The handwritten letters you saw are part of our exhibition on traditional Chinese culture."},{"k":"en","label":"教授研究项目","text":"Professor Smith is conducting a research project on campus sports activities."},{"k":"note","label":"注意","text":"题目给了具体事物时，不要笼统写 What you saw，直接点明：the letters / photographs / paintings you saw。"}]},{"id":"n-invite","title":"开头段 · 说明目的/邀请","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"邀请参加活动","text":"..., and I would like to invite you to join us."},{"k":"en","label":"邀请专家/担任角色","text":"On behalf of the Student Union, I would like to invite you to attend the event. / serve as a judge for the contest."},{"k":"en","label":"回应对方兴趣","text":"I would like to share more details with you."},{"k":"en","label":"发布招募通知","text":"..., so we are currently recruiting a student assistant / some volunteers for the project."},{"k":"note","label":"用词","text":"join us 是宽泛万能说法；出席活动用 attend；参加比赛/项目用 take part in / participate in；担任评委推荐 serve as a judge。"}]},{"id":"n-next","title":"开头段 · 引出下文","meta":"通知/邀请通用","tags":[],"blocks":[{"k":"en","label":"引出下文①","text":"Here is the relevant information:"},{"k":"en","label":"引出下文②","text":"The relevant information is as follows:"},{"k":"en","label":"引出下文③","text":"Here are some further details:"},{"k":"note","label":"注意","text":"第一种最适合基础模板，清楚、好记。后面继续写时间、地点、活动内容、职责要求或报名方式。"}]},{"id":"n-day","title":"主体段 · 单日活动","meta":"小标题完整模板 Time and Venue","tags":[],"blocks":[{"k":"en","label":"模板1","text":"The [event] will take place from [8 a.m.] to [11 a.m.] on [Wednesday, January 6, 2027], at [Wise Hall] on [the fourth floor of the university library]."},{"k":"en","label":"模板2","text":"Scheduled for [Wednesday, January 6, 2027], the [event] will be held from [8 a.m.] to [11 a.m.] at [the Main Campus Hall]."},{"k":"en","label":"模板3","text":"The [event] is scheduled for [Wednesday, January 6, 2027], from [8 a.m.] to [11 a.m.]. The venue will be [the Grand Auditorium], which can accommodate up to [800] people."},{"k":"note","label":"可替换","text":"[event / contest / lecture / ceremony]；地点位置：on the fourth floor of... / next to... / opposite...；Scheduled for... → To be held on...；will be held → will take place；第二句可改为 It will be held at [Wise Hall], located [next to the library]；场地信息：has recently been renovated / is equipped with modern facilities。模板1 最稳妥、最通用。"}]},{"id":"n-multi","title":"主体段 · 多日活动","meta":"小标题完整模板 Festival Schedule","tags":[],"blocks":[{"k":"en","label":"模板1","text":"The [arts festival] will run from [Saturday, May 8] to [Sunday, May 9], with activities taking place from [9 a.m.] to [6 p.m.] each day at [the Main Campus Hall and the university art center]."},{"k":"en","label":"模板2","text":"Taking place over [the weekend of May 8 and 9], the [festival] will feature activities from [9 a.m.] to [6 p.m.] on both days. Events will be held at [several venues across the main campus]."},{"k":"note","label":"可替换","text":"持续动词：will run from...to... / will last for [two days]；每天：each day / daily；over the weekend of... → throughout the weekend；多场地：at several venues across campus / at [Venue A] and [Venue B]。"}]},{"id":"n-long","title":"主体段 · 长期重复项目","meta":"小标题完整模板 Project Schedule","tags":[],"blocks":[{"k":"en","label":"模板1","text":"The [support project] will run for [eight weeks], from [March 6] to [April 25]. Volunteers will meet at [the Community Service Center] every [Saturday and Sunday] from [9 a.m.] to [4 p.m.]."},{"k":"note","label":"可替换","text":"总周期：for eight weeks / for two months / throughout the summer vacation；频率：every Saturday and Sunday / every weekend / on alternate weekends。"}]},{"id":"n-theme","title":"主体段 · 主题与核心内容","meta":"功能句型","tags":[],"blocks":[{"k":"en","label":"句1","text":"Themed \"[主题]\", the [event] will feature [核心内容]."},{"k":"en","label":"句2","text":"Under the theme of \"[主题]\", the [event] will showcase [核心内容]."},{"k":"en","label":"句3","text":"Centered on \"[主题]\", the [event] will include [核心内容]."},{"k":"en","label":"例","text":"Themed \"A Bite of China,\" the festival will feature traditional Chinese dishes from different regions."},{"k":"note","label":"用词","text":"Themed... 最简洁、最好用。核心动词：feature 重点呈现 / showcase 集中展示 / include 包含若干内容。"}]},{"id":"n-highlight","title":"主体段 · 活动高光（嘉宾/互动）","meta":"功能句型","tags":[],"blocks":[{"k":"en","label":"嘉宾","text":"Several [chefs / experts / artists] will also be invited to [give demonstrations / deliver speeches / share their experience]."},{"k":"en","label":"互动","text":"Participants will have the opportunity to interact with [the guests] through [workshops / discussions / question-and-answer sessions]."},{"k":"en","label":"例","text":"Several chefs will give live cooking demonstrations. Participants can exchange ideas with the experts during a question and answer session."},{"k":"note","label":"注意","text":"有嘉宾，重点写清楚：什么嘉宾＋做什么。有互动，不能只写空泛的 an interactive experience，要点明互动形式。"}]},{"id":"n-role","title":"主体段 · 邀请担任角色","meta":"功能句型 · 评委/发言人","tags":[],"blocks":[{"k":"en","label":"句1","text":"We would be honored if you could [serve as a judge for the contest / deliver a speech on the topic]."},{"k":"en","label":"句2","text":"Given your expertise in [领域], we sincerely hope you can [evaluate the contestants and offer feedback / share your insights with the audience]."},{"k":"note","label":"用词","text":"评委常用：serve as a judge / evaluate the contestants / offer professional feedback；发言常用：deliver a speech / give a short talk / share your insights。第一种直接点明角色；第二种补充邀请理由＋具体任务。"}]},{"id":"n-gain","title":"主体段 · 说明收获","meta":"功能句型","tags":[],"blocks":[{"k":"en","label":"普通参与者收获","text":"The event will offer you a valuable opportunity to [具体收获一] and [具体收获二]."},{"k":"en","label":"嘉宾参与意义","text":"Your participation will greatly enrich the event and help our students [具体收获]."},{"k":"note","label":"注意","text":"面向学生时写「参加后能得到什么」：experience Chinese culture / develop practical skills / exchange ideas and make new friends。邀请教授/专家时不必硬写「您会有收获」，更自然的是写：您的参与能为活动和学生带来什么。"}]},{"id":"n-volunteer","title":"主体段 · 志愿者职责与条件","meta":"功能句型","tags":[],"blocks":[{"k":"en","label":"职责+条件并列","text":"Volunteers will be responsible for [具体职责]. Applicants should be [条件一] and have [条件二]."},{"k":"en","label":"工作+优先条件","text":"The main duties include [职责一] and [职责二]. Preference will be given to students who [符合条件]."},{"k":"note","label":"用词","text":"常见职责：collect and organize information / interview participants / assist with event preparation / guide visitors and answer questions。常见条件：responsible and patient / good at communication / proficient in English / available at weekends。职责与条件必须紧扣题目，不能只写空泛的 hard-working。"}]},{"id":"n-safe","title":"二段安全写法","meta":"如果「我就想安全」","tags":[],"blocks":[{"k":"en","label":"安全模板","text":"First, ... Second, ..."},{"k":"en","label":"更自然","text":"Regarding A, ... / As for B, ..."},{"k":"note","label":"注意","text":"First...Second... 最容易掌握，适合基础学生，任何两个信息点都能套；Regarding A / As for B 更像真实邮件，直接点明每段信息，表达更自然。你当然可以格式安全，但重点是内容要强。"}]},{"id":"n-fanwen1","title":"范文① 唱歌比赛通知","meta":"2020 英一 · 小标题式全篇","tags":["通知"],"blocks":[{"k":"note","label":"真题","text":"The student union of your university has assigned you to inform the international students about an upcoming singing contest. Write a notice in about 100 words."},{"k":"ex","label":"范文","text":"Dear international students,\n\nI hope this message finds you well! My name is Li Ming, a member of the Student Union. Our university is going to hold a singing contest, and I am writing to invite you to participate. Here is the relevant information:\n\nTime and Venue\nScheduled for Friday, May 15, the contest will run from 2 p.m. to 5 p.m. It will be held at the newly renovated Main Campus Hall, which can accommodate up to 800 people.\n\nTheme and Highlights\nThemed \"Voices of Youth,\" the contest will feature both solo and group performances. Several music teachers will serve as judges and offer professional feedback. It will provide you with a valuable opportunity to showcase your talent, improve your stage confidence and make new friends.\n\nWe look forward to your participation.\n\nLi Ming"}]},{"id":"n-fanwen2","title":"范文② 夏令营志愿者招募","meta":"2015 英二 · Notice 标题格式","tags":["通知"],"blocks":[{"k":"note","label":"真题","text":"Suppose your university is going to host a summer camp for high school students. Write a notice to 1) briefly introduce the camp activities, and 2) call for volunteers."},{"k":"ex","label":"范文","text":"NOTICE\n\nDear fellow students,\n\nI hope this message finds you well! My name is Li Ming, a member of the Student Union. Our university is going to host a summer camp for high school students, and we are now recruiting student volunteers. Here is the relevant information:\n\nCamp Activities\nThemed \"Discover University Life,\" the camp will feature campus tours, team-building games and hands-on workshops. These activities will help participants experience university life and develop practical skills.\n\nDuties and Requirements\nThe main duties include guiding visitors, assisting with group activities and answering questions. Applicants should be responsible, patient and equipped with strong communication skills. Preference will be given to students who are proficient in English and available throughout the camp.\n\nWe look forward to your application.\n\nLi Ming"}]},{"id":"n-fanwen3","title":"范文③ 招募科研助理","meta":"23 英一 · 开头段示范","tags":["通知"],"blocks":[{"k":"note","label":"真题","text":"Write a notice to recruit a student for Prof. Smith's research project on campus sports activities. Specify the duties and requirements for the job."},{"k":"ex","label":"范文","text":"NOTICE\n\nDear fellow students,\n\nI hope this message finds you well! My name is Li Ming, the president of the Student Union. Professor Smith is currently conducting a study of students' participation in campus sports, and we are now seeking a student assistant to support the research.\n……"},{"k":"note","label":"注意","text":"通知只比 Email 多一个标题；落款不需要写「学生会」。"}]}]},{"id":"i","name":"邀请信 Invitation","full":"第三部分 · 邀请信 Invitation","group":"题型模板","color":"#a9783f","icon":"<path d=\"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z\"/><polyline points=\"22,6 12,13 2,6\"/>","items":[{"id":"i-structure","title":"写作结构","meta":"与通知共用开头段框架（见 2.2）","tags":[],"blocks":[{"k":"note","label":"段首","text":"打招呼、介绍自己、点出活动、告知邀请"},{"k":"note","label":"主体","text":"基础信息（时间地点）＋ 特定信息（主题、高光、收获）"},{"k":"note","label":"段尾","text":"呼吁参加、保证收获"}]},{"id":"i-fanwen1","title":"范文① 邀请教授带队参赛","meta":"22 英一 · 开头段示范","tags":["邀请信"],"blocks":[{"k":"note","label":"真题","text":"Write an email to a professor at a British university, inviting him/her to organize a team for the international innovation contest to be held at your university."},{"k":"ex","label":"范文","text":"Dear Professor Smith,\n\nI hope this message finds you well! My name is Li Ming, the president of the Student Union at Beijing University. We are going to hold an international innovation contest on artificial intelligence, so I would like to invite you to organize a team from your university to take part.\n……"},{"k":"note","label":"注意","text":"① 一定要认清审题、不要预设设定：既然对方是一所英国大学教授，你就不能说「我是我校学生会主席」——要编个笼统名字；② 要改写题中内容，而不是照抄：同义替换、或者具体化——有人跟你说「来参加我们的创新比赛」，不虚幻？什么方面创新，直接写。"}]},{"id":"i-fanwen2","title":"范文② 校园美食节","meta":"22 英二 · 小标题式全篇 132 字","tags":["邀请信"],"blocks":[{"k":"note","label":"真题","text":"Suppose you are planning a campus food festival. Write an e-mail to the international students in your university to 1) introduce the food festival, and 2) invite them to participate."},{"k":"ex","label":"范文","text":"Dear international students,\n\nI hope this message finds you well! My name is Li Ming, the president of the Student Union. Our university is going to hold a campus food festival, and I would like to invite you to participate. Here is the relevant information:\n\nFestival Schedule and Venues\nThe festival will run from Saturday, May 8, to Sunday, May 9, with activities taking place from 10 a.m. to 8 p.m. each day at the main campus square and the student activity center.\n\nTheme and Highlights\nThemed \"A Bite of China,\" the festival will feature traditional Chinese dishes from different regions. Several chefs will also give live cooking demonstrations, allowing you to experience Chinese food culture in an immersive and interactive way.\n\nWe look forward to your participation.\n\nYours sincerely,\nLi Ming"},{"k":"note","label":"提醒","text":"小作文不需要「拽词」：I feel extremely thrilled to inform you that… please allow me to extend my sincere and heartfelt invitation… 你是 AI 短剧演员吗？"}]}]},{"id":"s","name":"建议信 Suggestion","full":"第四部分 · 建议信 Suggestion","group":"题型模板","color":"#3f826d","icon":"<path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z\"/>","items":[{"id":"s-type","title":"类型与开头段结构","meta":"两类建议信","tags":[],"blocks":[{"k":"note","label":"纯建议信","text":"全文主要任务就是提出建议。开头段结构：身份（对方不认识你时）＋建议的触发点＋写信目的。触发点：你请教我、你有打算/兴趣、我组织的活动、我碰巧看到建议征集——不能唐突直给。"},{"k":"note","label":"建议是中心之一","text":"除建议外，还要介绍活动、说明安排、给出原因等；或建议为表象、实际解释原因。开头段结构：身份/背景＋第一项任务＋提出建议。"}]},{"id":"s-open1","title":"开头情境① 对方有打算","meta":"朋友、熟人不需要介绍自己","tags":[],"blocks":[{"k":"en","label":"模板","text":"I was delighted to hear that you are planning to [do sth.]. To help you [achieve a goal / make the most of it], I am writing to share a few practical suggestions."},{"k":"note","label":"逻辑","text":"很高兴得知对方的计划 → 为了帮助对方 → 提出建议。"}]},{"id":"s-open2","title":"开头情境② 对方询问意见","meta":"不需要介绍自己","tags":[],"blocks":[{"k":"en","label":"模板","text":"I was delighted to learn that you are interested in [sth.]. In response to your request/Since you also asked for my advice on..., I am writing to share a few suggestions on how to [do sth.]."},{"k":"note","label":"逻辑","text":"很高兴得知对方感兴趣 → 回应对方的询问 → 提出建议。课件第②条原文 my advise 为笔误，正确为 advice。"}]},{"id":"s-open3","title":"开头情境③ 公告征集意见","meta":"通常需介绍自己（校长/机构负责人）","tags":[],"blocks":[{"k":"en","label":"模板","text":"I am Li Ming, a [second-year student / regular user of the university canteen] at our university. I recently came across an announcement on the campus bulletin board inviting suggestions on how to [improve sth.]. I am therefore writing to offer several practical recommendations."},{"k":"note","label":"逻辑","text":"看到征集意见的公告 → 提出建议。"}]},{"id":"s-open4","title":"开头情境④ 活动介绍+建议","meta":"正式活动，类似通知信开头","tags":[],"blocks":[{"k":"en","label":"模板","text":"I am Li Ming, the [coordinator / volunteer] for [the event]. Our university will organize [the event] on [date]. I am writing to briefly introduce the arrangements and offer you a few practical suggestions for [the event / the tour]."},{"k":"note","label":"逻辑","text":"交代身份 → 告知将要来临的活动 → 给出中心句。"}]},{"id":"s-r1a","title":"三层建议 · 建议一（做起来）模板1","meta":"重要性 → 建议","tags":[],"blocks":[{"k":"en","label":"模板","text":"[Noun / Doing sth.] is critical / foundational for [sb. / doing sth.] to [达到某好处、目标], so I suggest that [人 / 机构] [do sth. 必须是动词原形]."},{"k":"en","label":"例句·增强体质","text":"First, adequate nutrition is critical for students to maintain good health, so I suggest that the university canteens offer more dishes rich in protein."},{"k":"en","label":"例句·学翻译","text":"First, a strong vocabulary is foundational for producing accurate translations, so I suggest that you build up your vocabulary through extensive reading."}]},{"id":"s-r1b","title":"三层建议 · 建议一（做起来）模板2","meta":"前置准备 → 后续顺利","tags":[],"blocks":[{"k":"en","label":"模板","text":"Before [doing sth. 核心行动], it is worth [doing sth. 前置准备], so that [sb.] can [achieve / avoid / understand sth. 后续行动更顺利 / 判断更准确]."},{"k":"en","label":"例句·来华工作","text":"First, before starting your job search, it is worth learning about different cities in China, so that you can decide where you would like to work."},{"k":"en","label":"例句·学翻译","text":"First, before focusing on more advanced translation skills, it is worth building up your vocabulary through extensive reading, so that you can understand and express ideas more accurately."}]},{"id":"s-r2a","title":"三层建议 · 建议二（做好）模板1","meta":"具体做法 → 直接效果","tags":[],"blocks":[{"k":"en","label":"模板","text":"To [do sth. better / achieve a goal], you can [具体做法]. [The resource / person] can help you [直接结果]."},{"k":"en","label":"例句·翻译","text":"Second, to improve your translation skills, you can take an online course or seek professional guidance. This way, you can learn useful translation techniques more quickly and avoid common mistakes."},{"k":"en","label":"例句·找工作","text":"Second, to adapt to working in China more quickly, you can learn more about Chinese workplace culture, especially from foreigners who have worked here. Their experience can help you avoid common misunderstandings at work."}]},{"id":"s-r2b","title":"三层建议 · 建议二（做好）模板2","meta":"更高目标 → 建议 → 举例","tags":[],"blocks":[{"k":"en","label":"模板","text":"If you intend to [更进一步的目标], it is advisable to [做法]. For example, you can [具体行动]."},{"k":"en","label":"例句·翻译","text":"Second, if you intend to make steady progress in translation, it is advisable to practise regularly. For example, you can translate a short passage every day and then compare your version with a good translation."},{"k":"en","label":"例句·找工作","text":"Second, if you intend to adapt quickly to working in China, it is advisable to learn about Chinese workplace culture in advance. For example, you can ask Chinese friends about common interview manners and ways of communicating at work."}]},{"id":"s-r3a","title":"三层建议 · 建议三（做稳）模板1","meta":"有条件补一个动作 → 额外收益","tags":[],"blocks":[{"k":"en","label":"模板","text":"Finally, try to [do sth.] whenever / if possible. By doing so, you will be able to [direct benefit]."},{"k":"en","label":"例句·翻译","text":"Finally, try to find a partner who is learning translation if possible. By doing so, you will be able to stay more motivated."},{"k":"en","label":"例句·找工作","text":"Finally, try to learn some basic Chinese if possible. By doing so, you will be able to make new friends quickly in China, which helps you blend in."}]},{"id":"s-r3b","title":"三层建议 · 建议三（做稳）模板2","meta":"别忘了做 → 为什么值得","tags":[],"blocks":[{"k":"en","label":"模板","text":"Finally, remember to do sth, as [它的相关性]; otherwise, + [不好、不方便的结果]"},{"k":"en","label":"例句·旅行","text":"Finally, remember to wear comfortable shoes, as the tour involves a lot of walking. Otherwise, you may get tired halfway through the visit."},{"k":"en","label":"例句·找工作","text":"Finally, remember to open a local bank account after you arrive, as mobile payments are widely used in China. Otherwise, everyday payments may be inconvenient."}]},{"id":"s-close","title":"结尾三种功能","meta":"建议信","tags":[],"blocks":[{"k":"en","label":"① 希望建议有帮助","text":"I hope you will find these suggestions useful / helpful."},{"k":"en","label":"② 愿意进一步沟通","text":"Should you have any further questions, please feel free to contact me."},{"k":"en","label":"③ 期待对方回应","text":"I look forward to your feedback."},{"k":"note","label":"用法","text":"① 最万能，朋友、学校、机构都能用；② 对方可能还会继续询问，朋友类、活动类尤其自然；③ 给校长、机构负责人等提出建议后很合适。"}]},{"id":"s-fanwen1","title":"范文① 给校长建议","meta":"2014 英一 · 三层建议完整示范","tags":["建议信"],"blocks":[{"k":"note","label":"真题","text":"Write a letter of about 100 words to the president of your university, suggesting how to improve students' physical condition."},{"k":"ex","label":"范文","text":"Dear President,\n\nI hope this message finds you well! I am Li Ming, a second-year student at our university. I recently came across an announcement on the campus bulletin board inviting suggestions on how to improve students' physical condition. I am therefore writing to offer several practical recommendations.\n\nFirst, adequate nutrition is critical for students to maintain good health, so I suggest that the university canteen offer more dishes rich in protein and fresh vegetables. Second, to encourage students to exercise regularly, the university can extend the opening hours of sports facilities. This can make exercise more convenient after class. Finally, the university may organize more sports activities if possible. By doing so, students will be able to develop healthier exercise habits.\n\nI hope you will find these suggestions useful.\n\nYours sincerely,\nLi Ming"}]},{"id":"s-fanwen2","title":"范文② 感谢+建议","meta":"16 英二 · 开头段示范","tags":["建议信"],"blocks":[{"k":"note","label":"真题","text":"Suppose you won a translation contest and your friend Jack wrote an email to congratulate you, and ask advice on translation. Write him a reply to 1) thank him; 2) give your advice."},{"k":"ex","label":"范文","text":"Dear Jack,\n\nI truly appreciate your kindness in congratulating me on winning the translation contest. Since you also asked for some advice on translation, I would be glad to share a few suggestions with you.\n……"},{"k":"note","label":"思考","text":"为什么这篇没用「祝好」开头？以及要注意改写，不要照抄原文词。"}]}]},{"id":"int","name":"介绍类 Introduction","full":"第五部分 · 介绍类 Introduction","group":"题型模板","color":"#7a6aa3","icon":"<path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/>","items":[{"id":"int-open1","title":"开头情境① 对方不认识你","meta":"2019 英一","tags":[],"blocks":[{"k":"en","label":"模板","text":"I hope this message finds you well! I am Li Ming, the coordinator of [项目/活动]. In response to your inquiry, I would be glad to share some details about [介绍对象]."},{"k":"note","label":"注意","text":"更适合项目、活动；组织负责人可用 the head of [组织]。如果不是回复询问，删去 In response to your inquiry。"}]},{"id":"int-open2","title":"开头情境② 熟人来信表达兴趣","meta":"2026、2025 英一","tags":[],"blocks":[{"k":"en","label":"模板","text":"I hope this message finds you well! Delighted to learn of your interest in [介绍对象], I would be happy to share some further details with you."},{"k":"note","label":"注意","text":"双方认识，不重复介绍姓名。further details 呼应「对方已经知道一些，现在想了解更多」。"}]},{"id":"int-open3","title":"开头情境③ 主动介绍活动","meta":"2025 英二","tags":[],"blocks":[{"k":"en","label":"模板","text":"I hope this message finds you well! I am currently planning [活动]. Since you mentioned your interest in [相关领域], I would like to tell you more about it and invite you to join us."},{"k":"note","label":"注意","text":"兴趣与活动要相关。如果题目已要求介绍并邀请，前一句的策划背景就足以引出目的，兴趣句可省去。只有需要邀请时才保留 and invite you to join us。"}]},{"id":"int-open4","title":"开头情境④ 双方已有共同任务","meta":"2024 英二","tags":[],"blocks":[{"k":"en","label":"模板","text":"I hope this message finds you well! Having given some thought to our [共同任务], I would like to share my plan with you and hear your views."},{"k":"note","label":"注意","text":"共同任务本身就是写信缘由，不必再补「听说你对此感兴趣」。our 承接双方已知信息；my plan 表示现在提出的是自己的方案。"}]},{"id":"int-open5","title":"开头情境⑤ 接受邀请后介绍","meta":"2017 英二","tags":[],"blocks":[{"k":"en","label":"模板","text":"Thank you for inviting me to [受邀做的事情]. I would be delighted to accept. To give you an idea of what I have in mind, I would like to outline [演讲/活动的主要内容]."},{"k":"note","label":"注意","text":"感谢邀请已经完成礼貌开场，不必再叠加祝好。outline 表示概述，适合介绍主要内容或安排。"}]},{"id":"int-book","title":"素材 · 书籍 / 小说","meta":"书/电影/短剧/景点通用四层","tags":[],"blocks":[{"k":"en","label":"写它有名","text":"one of the best-known novels in China（可补：has been adapted into films and television series）"},{"k":"en","label":"细节三连","text":"an engaging plot, vivid characters and beautiful language（引人入胜的情节、鲜活的人物、优美的语言）"},{"k":"en","label":"寓意","text":"reflect Chinese ideals of love and loyalty；convey a longing for happiness and reunion"},{"k":"en","label":"我最爱的点","text":"I especially admire the heroine, who has the courage to fight for her own happiness."}]},{"id":"int-movie","title":"素材 · 电影","meta":"书/电影/短剧/景点通用四层","tags":[],"blocks":[{"k":"en","label":"写它有名","text":"one of the most popular Chinese films（可补：has won numerous awards）"},{"k":"en","label":"细节三连","text":"an exciting plot, beautiful scenery and memorable music（精彩的情节、优美的景色、令人难忘的音乐）"},{"k":"en","label":"寓意","text":"reflect the interests and concerns of young people in modern China；showcase the courage of ordinary people"},{"k":"en","label":"我最爱的点","text":"I especially admire the main character, who refuses to give up despite repeated setbacks."}]},{"id":"int-play","title":"素材 · 短剧","meta":"2025 英二真题句型","tags":[],"blocks":[{"k":"en","label":"写它有名","text":"Our play is based on [原作], one of the best-known [作品类别] in China."},{"k":"en","label":"细节三连","text":"lively dialogue, touching scenes and expressive performances（生动的对白、感人的场景、富有表现力的演出）"},{"k":"en","label":"寓意","text":"reflect traditional values of love, loyalty and family unity（爱情、忠贞与家庭团结等传统价值）"},{"k":"en","label":"我最爱的点","text":"I especially enjoy bringing the characters to life on stage, and I am sure you will too."}]},{"id":"int-scenery","title":"素材 · 著名景点","meta":"书/电影/短剧/景点通用四层","tags":[],"blocks":[{"k":"en","label":"写它有名","text":"one of the best-known landmarks in China（可补：attracts visitors from around the world）"},{"k":"en","label":"细节三连","text":"impressive architecture, beautiful scenery and a rich history（令人赞叹的建筑、优美的风景、深厚的历史）"},{"k":"en","label":"寓意","text":"showcase the wisdom and creativity of earlier generations；遗址可写：symbolize strength and perseverance"},{"k":"en","label":"我最爱的点","text":"I especially enjoy exploring the site and learning the stories behind it, and I am sure you will too."}]},{"id":"int-midautumn","title":"素材 · 中秋节","meta":"借用思维：整体→细节→寓意→个人","tags":["节日"],"blocks":[{"k":"en","label":"整体交代","text":"The Mid-Autumn Festival is one of the most widely celebrated traditional festivals in China and an important occasion for family reunions."},{"k":"en","label":"三个细节","text":"It features family gatherings, mooncakes and moon gazing."},{"k":"en","label":"寓意","text":"These customs reflect the value Chinese people place on family unity, affection and harmony."},{"k":"en","label":"个人细节","text":"I especially enjoy sharing mooncakes with my family, as it gives us time to catch up and enjoy each other's company."}]},{"id":"int-dragonboat","title":"素材 · 端午节","meta":"借用思维：整体→细节→寓意→个人","tags":["节日"],"blocks":[{"k":"en","label":"整体交代","text":"The Dragon Boat Festival is one of China's best-known traditional festivals and an important part of its cultural heritage."},{"k":"en","label":"三个细节","text":"It features dragon boat races, rice dumplings and the exchange of wishes for health and safety."},{"k":"en","label":"寓意","text":"These customs reflect the importance Chinese people attach to good health, family ties and community spirit."},{"k":"en","label":"个人细节","text":"I especially enjoy watching the dragon boat races, cheering for the teams and sharing the excitement with the crowd."}]},{"id":"int-mobilepay","title":"热点素材 · 移动支付","meta":"整体→特点→价值→个人","tags":["热点"],"blocks":[{"k":"en","label":"整体交代","text":"Mobile payment is widely used in China and has become an important part of daily life."},{"k":"en","label":"特点三连","text":"It allows people to pay for shopping, meals and public transport with a smartphone, making everyday life more convenient."},{"k":"en","label":"价值","text":"Its popularity reflects the value people place on convenience, efficiency and innovation."},{"k":"en","label":"个人体验","text":"I especially enjoy going out with just my phone, as I can make payments without carrying cash."}]},{"id":"int-ev","title":"热点素材 · 电动汽车","meta":"整体→特点→价值→个人","tags":["热点"],"blocks":[{"k":"en","label":"整体交代","text":"Electric vehicles have become a common sight in Chinese cities and an important part of modern transport."},{"k":"en","label":"特点三连","text":"They offer a quiet driving experience, smooth acceleration and zero tailpipe emissions."},{"k":"en","label":"价值","text":"Their development reflects the importance people attach to technological innovation and environmental protection."},{"k":"en","label":"个人体验","text":"I especially enjoy the quiet, smooth ride, which makes daily travel more comfortable and relaxing."}]},{"id":"int-fanwen1","title":"范文① 短剧介绍+邀请","meta":"2025 英二 · 完整范文","tags":["介绍类"],"blocks":[{"k":"note","label":"真题","text":"Suppose you are planning a short play based on a classic Chinese novel. Write your friend John an email to 1) introduce the play, and 2) invite him to take part in it."},{"k":"ex","label":"范文","text":"Dear John,\n\nI hope this message finds you well! As I am planning a short play that you might enjoy, I would like to share more details with you.\n\nOur play is based on the classic Chinese novel The White Snake, a well-known love story that has inspired many adaptations. It will feature lively dialogue, touching scenes and expressive performances, reflecting Chinese ideals of love, loyalty and family unity. I especially admire the heroine, who bravely fights for her own happiness.\n\nWe would be delighted if you could play one of the main characters. No acting experience is required, and we will practise together before the performance. I am sure you will not only enjoy acting on stage but also gain confidence and make new friends.\n\nI look forward to your reply and participation.\n\nYours sincerely,\nLi Ming"}]},{"id":"int-fanwen2","title":"范文② 接受邀请+介绍演讲","meta":"2017 英二 · 完整范文","tags":["介绍类"],"blocks":[{"k":"note","label":"真题","text":"Suppose you are invited by Professor Williams to give a presentation about Chinese culture to a group of international students. Write a reply to 1) Accept the invitation, and 2) Introduce the key points of your presentation."},{"k":"ex","label":"范文","text":"Dear Professor Williams,\n\nThank you for inviting me to give a presentation on Chinese culture. I would be delighted to accept. To give you an idea of what I have in mind, I would like to outline the main points of my presentation.\n\nThe talk will focus on the Mid-Autumn Festival and the Dragon Boat Festival, two of China's best-known traditional festivals. I will introduce their celebrations, which feature family gatherings, traditional foods such as mooncakes and rice dumplings, and activities like moon gazing and dragon boat races. These customs reflect the importance Chinese people attach to family unity, harmony and good health. To make the talk more engaging, I will also plan an interactive session, in which students can ask questions and share similar festival traditions from their own countries.\n\nI hope the presentation will help them better understand Chinese traditions and cultural heritage.\n\nYours sincerely,\nLi Ming"}]},{"id":"int-fanwen3","title":"范文③ 回复志愿者询问","meta":"2019 英一 · 二段迁移示范","tags":["介绍类"],"blocks":[{"k":"note","label":"真题","text":"Suppose you are working for the \"Aiding Rural Primary Schools\" project of your university. Write an email to answer the inquiry from an international student volunteer. Specify the details of the project."},{"k":"en","label":"整体·周期","text":"The project will run on weekends from March to May, with volunteers leaving campus at 8 a.m. on Saturday and returning at 5 p.m. on Sunday."},{"k":"note","label":"迁移","text":"项目周期＋每周安排——把每天的活动时间换成每周往返时间。"},{"k":"en","label":"整体·地点","text":"Activities will take place at Hongxing Primary School, located in a rural area in the north of our city."},{"k":"note","label":"迁移","text":"地点＋具体位置——located… 补充学校在哪里。"},{"k":"en","label":"具体·职责","text":"Volunteers will be responsible for collecting donations on campus beforehand, teaching classes at the school and organizing cultural and sports activities."},{"k":"note","label":"迁移","text":"志愿者的三项职责。"},{"k":"en","label":"具体·你","text":"You could teach the children English and share stories about life in your country."},{"k":"note","label":"迁移","text":"对方可以承担什么——建议信里的 you could…。"},{"k":"note","label":"思路","text":"在陌生设定里找到准备过的内容。"}]},{"id":"int-migrate","title":"万能迁移句型","meta":"志愿者 / 邀请 / 活动安排","tags":[],"blocks":[{"k":"en","label":"志愿者职责","text":"Thank you for volunteering to offer help. Before the event, you could prepare the materials and set up the display area. On the day, we would also appreciate it if you could welcome the guests and show them around."},{"k":"note","label":"用词","text":"volunteer to do sth. 主动提出做某事；Before the event / On the day 分别展开活动前、活动当天的任务；would appreciate it if you could… 如果你能……我们将十分感谢（注意保留 it）；welcome the guests / show them around 接待嘉宾/带他们参观。"},{"k":"en","label":"邀请","text":"We would be delighted if you could play one of the main characters. I am sure you will not only enjoy acting on stage but also gain confidence and make new friends."},{"k":"note","label":"用词","text":"would be delighted if you could… 礼貌表达邀请；play a character / role 扮演角色；not only…but also… 后接并列的动词表达，将收获写成「享受体验＋提升自己＋结交朋友」。"},{"k":"en","label":"活动安排","text":"The letters are currently on display in the university library from 9 a.m. to 5 p.m. daily, with volunteers available to explain the stories behind them and answer your questions."},{"k":"note","label":"用词","text":"be on display 正在展出；daily 每天，可替换 every day；with＋名词＋形容词 补充现场安排；available to do… 表示有人可以提供帮助；the stories behind… 可迁移到 letters、paintings、photographs 等介绍对象。"}]}]},{"id":"r","name":"回信类 Reply","full":"第六部分 · 回信类（解释·计划·答复）","group":"题型模板","color":"#bb5a4a","icon":"<polyline points=\"9 17 4 12 9 7\"/><path d=\"M20 18v-2a4 4 0 0 0-4-4H4\"/>","items":[{"id":"r-2025","title":"2025 英一 · 回复 Paul 询问","meta":"二段迁移示范","tags":["回信"],"blocks":[{"k":"note","label":"真题","text":"Read the following email from your classmate Paul and write him a reply. 来信：I was really excited to hear that you'd invite some young craftsmen to demonstrate their innovative craft-making on campus. May I know more about what they'll show? Also, I'd like to help with your preparation work. Please let me know what I can do."},{"k":"en","label":"整体·主题","text":"Themed \"Tradition Meets Innovation,\" the event will feature creative crafts that combine traditional techniques with modern designs."},{"k":"en","label":"具体·谁来做什么","text":"Several young craftspeople will be invited to introduce their work, demonstrate how to make simple crafts and interact with the audience."},{"k":"en","label":"具体·参加者","text":"An interactive session will allow participants to make their own paper-cut decorations and ask the craftspeople questions."}]},{"id":"r-2024","title":"2024 英二 · 调查计划+征求意见","meta":"二段迁移示范","tags":["回信"],"blocks":[{"k":"note","label":"真题","text":"Suppose you and Jack are going to do a survey on the protection of old houses in an ancient town. Write him an email to 1) put forward your plan, and 2) ask for his opinion."},{"k":"en","label":"做起来","text":"We can start by finding out when the old houses in the town were built, which would help us develop suitable protection plans."},{"k":"note","label":"迁移","text":"start by n./doing 从……入手；which would help us do… 补充说明这一步的作用，help 后接动词原形。"},{"k":"en","label":"做好","text":"Following this, I suggest that we record their exact locations and sizes, using the information to create a map and 3D models."},{"k":"note","label":"迁移","text":"Following this 接下来，衔接上一步；suggest that＋主语＋动词原形；using…to do… 用分词结构补充说明如何利用这些信息。"},{"k":"en","label":"补充","text":"If time permits, we could invite local senior citizens to explain why the houses were designed that way."},{"k":"note","label":"迁移","text":"If time permits 如果时间允许，条件从句用一般现在时；invite sb. to do sth.；why the houses were designed… 宾语从句用陈述语序，不写成 why were the houses…。"}]},{"id":"r-2026","title":"2026 英一 · 回复展出询问","meta":"完整范文","tags":["回信"],"blocks":[{"k":"note","label":"真题","text":"Read the following email from an international student and write a reply.（对方对手写书信展感兴趣）"},{"k":"ex","label":"范文","text":"Dear Paul,\n\nI'm delighted that you are interested in the handwritten letters I posted. In fact, I am the coordinator of this month's campus cultural festival, and those letters form part of our exhibition.\n\nThey were written during the Mid-Autumn Festival by ancient Chinese people to family members living far away. Traditionally, the festival is a cherished moment for family reunion, when the full moon serves as a symbol of harmony and completeness. Even for those separated by distance, handwritten letters served as a means of connection, carrying their longing and best wishes to their loved ones.\n\nThe festival runs throughout this month. You can see the originals at the Campus Activity Center from 8 a.m. to 5 p.m. Volunteers will introduce the exhibits, and I believe you will deepen your understanding of Chinese culture.\n\nBest regards,\nLi Ming"}]}]},{"id":"z","name":"真题带练","full":"附录 · 真题带练清单","group":"真题练习","color":"#2f8f8b","icon":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>","items":[{"id":"z-1","title":"22 英一 · 邀请教授","meta":"真题带练 · 按带练顺序","tags":[],"blocks":[{"k":"note","label":"真题","text":"Write an email to a professor at a British university, inviting him/her to organize a team for the international innovation contest to be held at your university."}]},{"id":"z-2","title":"21 英二 · 线上会议","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Suppose you are organizing an online meeting. Write an email to Jack, an international student, to 1) invite him to participate, and 2) tell him the details."}]},{"id":"z-3","title":"23 英一 · 科研助理","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Write a notice to recruit a student for Prof. Smith's research project on campus sports activities. Specify the duties and requirements for the job."}]},{"id":"z-4","title":"16 英一 · 图书馆通知","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Suppose you are a librarian in your university. Write a notice of about 100 words, providing the newly-enrolled international students with relevant information about the library."}]},{"id":"z-5","title":"19 英一 · 支教项目","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Suppose you are working for the \"Aiding Rural Primary Schools\" project of your university. Write an email to answer the inquiry from an international student volunteer. Specify the details of the project."}]},{"id":"z-6","title":"11 英二 · 祝贺+建议","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Suppose your cousin Li Ming has just been admitted to a university. Write him/her a letter to 1) congratulate him/her, and 2) give him/her suggestions on how to get prepared for university life."}]},{"id":"z-7","title":"13 英二 · 慈善义卖","meta":"真题带练","tags":[],"blocks":[{"k":"note","label":"真题","text":"Suppose your class is to hold a charity sale for kids in need of help. Write your classmates an email to 1) inform them about the details, and 2) encourage them to participate."}]}]}] }

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function allItems(){ const r=[]; DATA.forEach(c=>c.items.forEach(it=>r.push(Object.assign({},it,{category:c})))); return r; }
function findItem(id){ return allItems().find(w=>w.id===id); }
function isEnWord(title){ return /^[A-Za-z]/.test(title); }
function isRecallable(it){ return it.blocks.some(b=>b.k==='en'||b.k==='ex'); }

/* ================= 常量 ================= */
const INTERVALS = {1:1, 2:3, 3:7, 4:14};
const LEVELS = ['新学','生疏','一般','熟练','已掌握'];
let BOOK='lunshuowen', DATA=BOOKS.lunshuowen.data, LS=BOOKS.lunshuowen.ls, TOTAL=DATA.reduce((s,c)=>s+c.items.length,0);

/* ================= 状态 ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let theme = localStorage.getItem('beisong_theme') || 'light';
let S = { srs:{}, favs:new Set(), notes:{}, dailyNew:5, daily:{date:'',done:0} };
const ui = { view:'browse', catId:'all', q:'', blur:'none',
  flashFilter:'all', flashIndex:0, flashFlipped:false,
  quizFilter:'unmastered', quizDeck:[], quizIndex:0, quizRevealed:false, session:{reviewed:0,mastered:0},
  reviewQueue:[], reviewIndex:0, reviewRevealed:false, reviewStats:{ok:0,no:0},
  randomId:null, randomRevealed:false };

function loadState(){
  let srs = JSON.parse(localStorage.getItem(LS+'_srs')||'{}');
  if(BOOK==='lunshuowen' && Object.keys(srs).length===0){
    const old = JSON.parse(localStorage.getItem('lunshuowen_v1_mastered')||'[]');
    old.forEach(id=>{ srs[id]={lvl:4, due:addDays(30)}; });
    if(old.length) localStorage.setItem(LS+'_srs', JSON.stringify(srs));
  }
  S.srs = srs;
  S.favs = new Set(JSON.parse(localStorage.getItem(LS+'_favs')||'[]'));
  let notes = JSON.parse(localStorage.getItem(LS+'_notes')||'{}');
  if(BOOK==='lunshuowen' && Object.keys(notes).length===0){
    const fen = JSON.parse(localStorage.getItem(LS+'_fen')||'{}');
    if(Object.keys(fen).length) notes = fen;
  }
  S.notes = notes;
  S.dailyNew = parseInt(localStorage.getItem(LS+'_dailyNew')||'5',10);
  S.daily = JSON.parse(localStorage.getItem(LS+'_daily')||'{"date":"","done":0}');
  if(S.daily.date !== todayStr()) S.daily = {date:todayStr(), done:0};
}
function persistSrs(){ localStorage.setItem(LS+'_srs', JSON.stringify(S.srs)); }
function persistFavs(){ localStorage.setItem(LS+'_favs', JSON.stringify([...S.favs])); }
function persistNotes(){ localStorage.setItem(LS+'_notes', JSON.stringify(S.notes)); }

function getSrs(id){ return S.srs[id] || {lvl:0, due:''}; }
function isMastered(id){ return (S.srs[id]?.lvl ?? 0) >= 4; }
function masteredCount(){ return allItems().filter(w=>isMastered(w.id)).length; }
function levelOf(id){ return Math.min(4, S.srs[id]?.lvl ?? 0); }

function srsAnswer(id, correct){
  const cur = getSrs(id);
  if(correct){
    const lvl = Math.min(4, cur.lvl + 1);
    S.srs[id] = { lvl, due: addDays(INTERVALS[lvl] || 14) };
  } else {
    const lvl = Math.max(0, cur.lvl - 1);
    S.srs[id] = { lvl, due: lvl > 0 ? todayStr() : '' };
  }
  persistSrs(); bumpDaily();
}
function bumpDaily(){
  if(S.daily.date !== todayStr()) S.daily = {date:todayStr(), done:0};
  S.daily.done++;
  localStorage.setItem(LS+'_daily', JSON.stringify(S.daily));
  $('#statToday').textContent = S.daily.done + ' 条';
}

/* ================= 渲染 ================= */
const content = $('#content');
function renderContent(){
  if(ui.view==='review') return renderReview();
  if(ui.view==='flash') return renderFlash();
  if(ui.view==='quiz') return renderQuiz();
  renderBrowse();
}

function blockHTML(b){
  if(b.k==='note') return `<div class="blk note"><span class="btag">${b.label}</span><p class="btext">${esc(b.text)}</p></div>`;
  const cls = b.k==='ex' ? 'ex' : 'en';
  return `<div class="blk ${cls}" data-bt="${b.k}"><span class="btag">${b.label}</span><p class="btext">${esc(b.text)}</p><button class="reveal">👁 点击显示</button></div>`;
}

function cardHTML(it){
  const cat = it.category;
  const lvl = levelOf(it.id);
  const m = lvl >= 4;
  const f = S.favs.has(it.id);
  const titleCls = isEnWord(it.title) ? 'en' : '';
  return `<article class="card ${m?'mastered':''}" id="card-${it.id}" data-id="${it.id}" style="--cat:${cat.color}">
    <div class="card-head">
      <div class="card-title">
        <h3 class="${titleCls}">${esc(it.title)}</h3>
        <span class="cat-chip">${cat.name}</span>
        <span class="lvl lvl${lvl}">${LEVELS[lvl]}</span>
      </div>
      <div class="card-actions">
        <button class="icon-btn ${f?'fav-on':''}" data-act="fav" data-id="${it.id}" title="收藏">★</button>
        <button class="icon-btn ${m?'master-on':''}" data-act="master" data-id="${it.id}" title="标记掌握">${m?'✓':'○'}</button>
        <button class="icon-btn" data-act="copy" data-id="${it.id}" title="复制">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    ${it.meta?`<div class="meta">${esc(it.meta)}</div>`:''}
    ${it.tags && it.tags.length?`<div class="tags">${it.tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div>`:''}
    ${it.blocks.map(blockHTML).join('')}
    <textarea class="para-note" data-note="${it.id}" placeholder="${BOOKS[BOOK].noteLabel}">${esc(S.notes[it.id]||'')}</textarea>
  </article>`;
}

function sectionHeader(cat){
  const done = cat.items.filter(w=>isMastered(w.id)).length;
  return `<div class="section">
    <div class="section-head">
      <div class="sq" style="background:${cat.color}"><svg viewBox="0 0 24 24">${cat.icon}</svg></div>
      <div><h3>${cat.name}</h3><div class="sub">${cat.full} · ${cat.items.length} 条</div></div>
      <div class="spacer"></div>
      ${done===cat.items.length?`<span class="done-badge">已全部掌握 ✓</span>`:`<span class="sub">${done}/${cat.items.length} 已掌握</span>`}
    </div>
  </div>`;
}

function visibleItems(){
  let list = allItems();
  if(ui.catId!=='all') list = list.filter(w=>w.category.id===ui.catId);
  if(ui.q){
    const q = ui.q.trim().toLowerCase();
    if(q) list = list.filter(w => w.title.toLowerCase().includes(q) || (w.meta||'').toLowerCase().includes(q) || w.blocks.some(b=>b.text.toLowerCase().includes(q)) || w.category.name.includes(ui.q.trim()));
  }
  return list;
}

function renderBrowse(){
  const list = visibleItems();
  if(!list.length){
    content.innerHTML = `<div class="empty"><div class="big">🔍</div><h3>没有找到相关内容</h3><p>换个关键词试试，或清除搜索。</p></div>`;
    return;
  }
  let html='';
  if(ui.catId==='all' && !ui.q){
    DATA.forEach(cat=>{
      const ws = list.filter(w=>w.category.id===cat.id);
      if(!ws.length) return;
      html += sectionHeader(cat) + `<div class="grid">${ws.map(cardHTML).join('')}</div>`;
    });
  } else if(ui.catId==='all' && ui.q){
    html += `<div class="section-head"><div><h3>搜索结果</h3><div class="sub">${list.length} 条匹配</div></div></div>`;
    html += `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  } else {
    const cat = DATA.find(c=>c.id===ui.catId);
    html += sectionHeader(cat) + `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML = html;
  applyBlur();
}

function applyBlur(){
  document.querySelectorAll('.blk[data-bt]').forEach(p=>{
    const bt = p.dataset.bt;
    p.classList.toggle('blurred', ui.blur==='all' || ui.blur===bt);
  });
}

/* ================= 侧边栏 ================= */
function renderSidebar(){
  const nav = $('#nav');
  const allDone = masteredCount();
  let html = `<div class="nav-label">目录</div>`;
  html += `<div class="nav-item ${ui.catId==='all'?'active':''}">
    <button class="nav-row" data-cat="all">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span class="nav-name">全部</span>
      <span class="nav-count" id="cnt-all">${allDone}/${TOTAL}</span>
    </button>
  </div>`;
  let lastGroup = '';
  DATA.forEach(cat=>{
    if(cat.group !== lastGroup){
      html += `<div class="nav-label">${cat.group || ''}</div>`;
      lastGroup = cat.group;
    }
    const done = cat.items.filter(w=>isMastered(w.id)).length;
    html += `<div class="nav-item ${ui.catId===cat.id?'active':''}">
      <button class="nav-row" data-cat="${cat.id}">
        <span class="ic" style="--cat:${cat.color}"><svg viewBox="0 0 24 24">${cat.icon}</svg></span>
        <span class="nav-name">${cat.name}</span>
        <span class="nav-count" id="cnt-${cat.id}">${done}/${cat.items.length}</span>
      </button>

function hintsHTML(it){
  let h = '';
  if(it.meta) h += `<div class="meta">${esc(it.meta)}</div>`;
  if(it.tags && it.tags.length) h += `<div class="tags">${it.tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div>`;
  h += it.blocks.filter(b=>b.k==='note').map(blockHTML).join('');

function answerHTML(it, revealed){

/* ================= 复习 ================= */
function buildReviewQueue(){
  const t = todayStr();
  const pool = allItems().filter(isRecallable);
  const due = pool.filter(w=>{ const s=getSrs(w.id); return s.lvl>=1 && s.due && s.due<=t; })
    .sort((a,b)=> (getSrs(a.id).due||'').localeCompare(getSrs(b.id).due||''));
  const fresh = shuffle(pool.filter(w=>(S.srs[w.id]?.lvl??0)===0));
  ui.reviewQueue = due.concat(fresh.slice(0, S.dailyNew));
  ui.reviewIndex = 0; ui.reviewRevealed = false; ui.reviewStats = {ok:0,no:0};
}
function buildFreeQueue(){
  ui.reviewQueue = shuffle(allItems().filter(isRecallable));
  ui.reviewIndex = 0; ui.reviewRevealed = false; ui.reviewStats = {ok:0,no:0};
}
function renderReview(){
  const t = todayStr();
  const pool = allItems().filter(isRecallable);
  const dueNow = pool.filter(w=>{ const s=getSrs(w.id); return s.lvl>=1 && s.due && s.due<=t; }).length;
  const fresh = pool.filter(w=>(S.srs[w.id]?.lvl??0)===0).length;
  const mastered = masteredCount();
  const q = ui.reviewQueue;
  const head = `<div class="review-head">
    <div class="stat-tile"><div class="n g">${mastered}/${TOTAL}</div><div class="l">已掌握</div></div>
    <div class="stat-tile"><div class="n r">${dueNow}</div><div class="l">今日到期</div></div>
    <div class="stat-tile"><div class="n a">${fresh}</div><div class="l">待学新条目</div></div>
    <div class="stat-tile"><div class="n">${S.daily.done||0}</div><div class="l">今日已复习</div></div>
    <div class="head-ctrl">
      <label class="l" style="font-size:11px;color:var(--ink-3);letter-spacing:1px">每日新条目</label>
      <select class="select" id="dailyNewSel">
        ${[0,3,5,8].map(n=>`<option value="${n}" ${S.dailyNew===n?'selected':''}>${n===0?'仅复习':n+' 条'}</option>`).join('')}
      </select>
    </div>
  </div>`;
  let body;
  if(q.length===0){
    body = `<div class="empty"><div class="big">🌿</div><h3>今日暂无复习任务</h3><p>已掌握 ${mastered}/${TOTAL}。${fresh>0?'可以增加「每日新条目」开始学习，':''}或自由抽背全部。</p>
      <button class="btn primary" data-rv="again">开始复习</button>
      <button class="btn" data-rv="all">🎲 自由抽背全部</button></div>`;
  } else if(ui.reviewIndex >= q.length){
    body = `<div class="empty"><div class="big">🎉</div><h3>本轮复习完成</h3><p>记得 ${ui.reviewStats.ok} 条 · 忘了 ${ui.reviewStats.no} 条 · 今日累计复习 ${S.daily.done} 条</p>
      <button class="btn primary" data-rv="again">再来一轮</button>
      <button class="btn" data-rv="all">🎲 自由抽背全部</button>
      <button class="btn" data-rv="browse">返回浏览</button></div>`;
  } else {
    const it = q[ui.reviewIndex];
    const lvl = levelOf(it.id);
    const titleCls = isEnWord(it.title) ? 'en' : '';
    body = `<div class="quiz-card">
      <div class="quiz-top">
        <div>
          <div class="quiz-word ${titleCls}">${esc(it.title)}</div>
          <div class="quiz-cat">${it.category.full}</div>
        </div>
        <span class="lvl lvl${lvl}">${LEVELS[lvl]}</span>
      </div>
      <div class="quiz-prompt">第 ${ui.reviewIndex+1} / ${q.length} · 回忆内容</div>
      ${hintsHTML(it)}
      ${answerHTML(it, ui.reviewRevealed)}
      <div class="quiz-actions">
        ${!ui.reviewRevealed?`<button class="btn primary" data-rv="reveal">显示答案</button>`
          :`<button class="btn ghost-green" data-rv="ok">✔ 记得</button><button class="btn" data-rv="no">✘ 忘了</button>`}
      </div>
    </div>
    <div class="quiz-stats"><span>本轮记得 <b>${ui.reviewStats.ok}</b></span><span>本轮忘了 <b>${ui.reviewStats.no}</b></span><span>今日已复习 <b>${S.daily.done}</b></span></div>`;
  }
  content.innerHTML = `<div class="review-wrap">${head}${body}</div>`;
}

function exportBackup(){
  const data = {app:'考研背诵卡合集', book:BOOK, bookName:BOOKS[BOOK].name, version:1, exportedAt:new Date().toISOString(), srs:S.srs, favs:[...S.favs], notes:S.notes};

  a.href = URL.createObjectURL(blob); a.download = BOOKS[BOOK].name+'-备份.json'; a.click();

}
function importBackup(data){
  if(!data || typeof data!=='object'){ toast('备份文件无效'); return; }
  if(data.book && BOOKS[data.book] && data.book!==BOOK){
    if(!confirm('这份备份来自「'+BOOKS[data.book].name+'」，当前科目是「'+BOOKS[BOOK].name+'」。切换到该科目并导入吗？')){
      return;
    }
    switchBook(data.book);
  }
  if(data.srs && typeof data.srs==='object') S.srs = data.srs;
  if(Array.isArray(data.favs)) S.favs = new Set(data.favs);
  if(data.notes && typeof data.notes==='object') S.notes = data.notes;
  persistSrs(); persistFavs(); persistNotes();
  renderSidebar(); updateStats(); renderContent();
  toast('已导入备份 ✓');
}
function copyText(txt){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
}

/* ================= 动作 ================= */
function toggleFav(id){
  if(S.favs.has(id)) S.favs.delete(id); else S.favs.add(id);
  persistFavs();
  const btn = document.querySelector(`[data-act="fav"][data-id="${id}"]`);
  if(btn) btn.classList.toggle('fav-on', S.favs.has(id));
  updateStats();
}
function toggleMaster(id){
  if(isMastered(id)){ S.srs[id] = {lvl:0, due:''}; }
  else { S.srs[id] = {lvl:4, due:addDays(30)}; }
  persistSrs();
  const card = document.getElementById('card-'+id);
  if(card){
    card.classList.toggle('mastered', isMastered(id));
    const lvlBadge = card.querySelector('.lvl');
    if(lvlBadge){ lvlBadge.className = 'lvl lvl'+levelOf(id); lvlBadge.textContent = LEVELS[levelOf(id)]; }
    const btn = card.querySelector('[data-act="master"]');
    if(btn){ btn.classList.toggle('master-on', isMastered(id)); btn.textContent = isMastered(id)?'✓':'○'; }
  }
  renderSidebar(); updateStats();
  toast(isMastered(id)?'已标记掌握 ✓':'已取消掌握');
}
function copyItem(id){
  const it = findItem(id); if(!it) return;
  const lines = [`【${it.title}】${it.meta||''}`, ...(it.tags||[]).map(t=>`· ${t}`), ...it.blocks.map(b=>`${b.label}：${b.text}`)];
  copyText(lines.join('\n'));
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function switchBook(key){

  BOOK = key;

  LS = BOOKS[key].ls;
  TOTAL = DATA.reduce((s,c)=>s+c.items.length,0);

  ui.quizDeck=[]; ui.quizIndex=0; ui.quizRevealed=false; ui.session={reviewed:0,mastered:0};

/* ================= 事件 ================= */
content.addEventListener('click', e=>{
  const reveal = e.target.closest('.reveal');
  const blk = e.target.closest('.blk');
  if(reveal || (blk && blk.classList.contains('blurred'))){
    if(blk){ blk.classList.remove('blurred'); return; }
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const id = act.dataset.id, a = act.dataset.act;
    if(a==='fav') toggleFav(id);
    else if(a==='master') toggleMaster(id);
    else if(a==='copy') copyItem(id);
    return;
  }
  const fa = e.target.closest('[data-fa]');
  if(fa){
    const a = fa.dataset.fa;
    if(a==='flip') flashFlip();
    else if(a==='prev') flashGo(-1);
    else if(a==='next') flashGo(1);
    else if(a==='shuffle'){ const l=flashList(); if(l.length){ ui.flashIndex=Math.floor(Math.random()*l.length); ui.flashFlipped=false; renderFlash(); } }
    else if(a==='master'){ const l=flashList(); const w=l[ui.flashIndex]; if(w) toggleMaster(w.id); }
    return;
  }
  const qa = e.target.closest('[data-qa]');
  if(qa){
    const a = qa.dataset.qa;
    const w = ui.quizDeck[ui.quizIndex];
    if(a==='reveal'){ ui.quizRevealed=true; renderQuiz(); }
    else if(a==='know'){ ui.session.reviewed++; ui.session.mastered++; if(w && !isMastered(w.id)){ S.srs[w.id]={lvl:4,due:addDays(30)}; persistSrs(); renderSidebar(); updateStats(); } quizNext(); }
    else if(a==='again'){ ui.session.reviewed++; quizNext(); }
    return;
  }
  const rv = e.target.closest('[data-rv]');
  if(rv){
    const a = rv.dataset.rv;
    if(a==='reveal'){ ui.reviewRevealed=true; renderReview(); }
    else if(a==='ok'){ const w=ui.reviewQueue[ui.reviewIndex]; if(w) srsAnswer(w.id,true); ui.reviewStats.ok++; renderSidebar(); updateStats(); reviewNext(); }
    else if(a==='no'){ const w=ui.reviewQueue[ui.reviewIndex]; if(w) srsAnswer(w.id,false); ui.reviewStats.no++; renderSidebar(); updateStats(); reviewNext(); }
    else if(a==='again'){ buildReviewQueue(); renderReview(); }
    else if(a==='all'){ buildFreeQueue(); renderReview(); }
    else if(a==='browse'){ setView('browse'); }
    return;
  }
  const fcard = e.target.closest('#flashCard');
  if(fcard){ flashFlip(); return; }
});

content.addEventListener('input', e=>{

    S.notes[e.target.dataset.note] = e.target.value;

content.addEventListener('change', e=>{

$('#nav').addEventListener('click', e=>{
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn){ setCat(catBtn.dataset.cat); return; }
  const chip = e.target.closest('[data-chip]');
  if(chip){
    const w = findItem(chip.dataset.chip);
    if(w){ setCat(w.category.id); setTimeout(()=>{ const el=document.getElementById('card-'+chip.dataset.chip); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.boxShadow='0 0 0 3px var(--accent)'; setTimeout(()=>el.style.boxShadow='',1200);} },60); }
  }
});
function setCat(id){
  ui.catId = id;
  if(ui.view!=='browse') setView('browse');
  renderSidebar(); renderContent();
  closeSidebar();
}
function setView(v){
  ui.view = v;
  $('#viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  const titles = {
    browse:['总览', BOOKS[BOOK].sub + ' · ' + TOTAL + ' 条'],
    review:['每日复习','间隔重复 · 今日任务'],
    flash:['抽卡复习','翻面回忆 · 空格翻面'],
    quiz:['挖空默写','遮住内容 · 先回忆再核对']
  };
  $('#viewTitle').textContent = titles[v][0];
  $('#viewSub').textContent = titles[v][1];
  if(v==='review') buildReviewQueue();
  if(v==='quiz') buildQuizDeck();
  if(v==='flash'){ ui.flashIndex=0; ui.flashFlipped=false; }
  renderContent();
}
$('#viewSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-view]');
  if(b) setView(b.dataset.view);
});
$('#bookSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-book]');
  if(b && b.dataset.book!==BOOK) switchBook(b.dataset.book);
});
$('#blurSel').addEventListener('change', e=>{ ui.blur=e.target.value; applyBlur(); });
$('#searchInput').addEventListener('input', e=>{ ui.q=e.target.value; if(ui.view!=='browse') setView('browse'); renderContent(); });
function toggleTheme(){
  theme = theme==='light'?'dark':'light';
  localStorage.setItem('beisong_theme', theme); applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIconSun').style.display = theme==='dark'?'none':'block';
  $('#themeIconMoon').style.display = theme==='dark'?'block':'none';
}
$('#themeBtn').addEventListener('click', toggleTheme);
$('#randomBtn').addEventListener('click', openRandom);
$('#shareBtn').addEventListener('click', ()=>{ renderShareCard(); $('#shareModal').classList.add('show'); });

document.addEventListener('click', e=>{
  const c = e.target.closest('[data-close]');
  if(c){ closeModal(c.dataset.close); return; }
  const r = e.target.closest('[data-rand]');
  if(r){
    const a = r.dataset.rand;
    if(a==='reveal'){ ui.randomRevealed=true; renderRandomCard(); }
    else if(a==='reroll'){ pickRandom(); }
    else if(a==='ok'){ const w=findItem(ui.randomId); if(w) srsAnswer(w.id,true); pickRandom(); }
    else if(a==='no'){ const w=findItem(ui.randomId); if(w) srsAnswer(w.id,false); pickRandom(); }
    else if(a==='master'){ if(ui.randomId) toggleMaster(ui.randomId); renderRandomCard(); }
    else if(a==='copy'){ if(ui.randomId) copyItem(ui.randomId); }
    return;
  }
  const s = e.target.closest('[data-share]');
  if(s){
    const a = s.dataset.share;
    if(a==='copy') copyText('推荐一份考研背诵卡合集 📝\n一个文件装下「论说文 + 英语二作文 + 小作文」三大背诵库，含背诵遮罩、抽卡、间隔复习、默写，离线可用、手机电脑都能开。\n把附件《考研背诵卡合集.html》发给朋友，双击即可打开。');
    else if(a==='export') exportBackup();
    else if(a==='import') $('#importFile').click();
    else if(a==='copy-url') copyText('把《考研背诵卡合集.html》文件拖到 netlify.com/drop（免费、无需注册），几秒后即可得到一个网址链接发给朋友；也可以传到 GitHub Pages。');
    return;
  }
});
$('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ try{ importBackup(JSON.parse(reader.result)); }catch(err){ toast('文件解析失败'); } };
  reader.readAsText(file);
  e.target.value = '';
});
$('#btnReset').addEventListener('click', ()=>{
  if(confirm('确定清除「'+BOOKS[BOOK].name+'」的掌握、收藏和笔记记录吗？')){
    S.srs = {}; S.favs.clear(); S.notes = {};
    S.daily = {date:todayStr(), done:0};
    persistSrs(); persistFavs(); persistNotes();
    localStorage.setItem(LS+'_daily', JSON.stringify(S.daily));
    renderSidebar(); updateStats(); renderContent();
    toast('已清除「'+BOOKS[BOOK].name+'」学习进度');
  }
});
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', ()=>{ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', closeSidebar);
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show')); }
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if(ui.view==='flash'){
    if(e.code==='Space'){ e.preventDefault(); flashFlip(); }
    else if(e.code==='ArrowRight'){ flashGo(1); }
    else if(e.code==='ArrowLeft'){ flashGo(-1); }
  } else if(ui.view==='quiz'){
    if(e.code==='Space'){ e.preventDefault(); if(!ui.quizRevealed){ ui.quizRevealed=true; renderQuiz(); } }
  } else if(ui.view==='review'){
    if(e.code==='Space'){ e.preventDefault(); if(!ui.reviewRevealed){ ui.reviewRevealed=true; renderReview(); } }
  }
});

/* ================= 启动 ================= */
applyTheme();
let initBook = localStorage.getItem('beisong_book');
if(!BOOKS[initBook]) initBook = 'lunshuowen';
switchBook(initBook);
</script>
</body>
