<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研背诵卡 · 合集</title>
<style>
:root{
  --bg:#f5f1e8;
  --bg-soft:#ece5d6;
  --surface:#fffdf8;
  --surface-2:#faf6ec;
  --ink:#27221a;
  --ink-2:#6c6354;
  --ink-3:#a89e8b;
  --line:#e5ddcc;
  --line-2:#f0eadb;
  --accent:#b5483c;
  --accent-soft:#f4e3de;
  --green:#3f826d;
  --green-soft:#e0ede7;
  --red:#b5483c;
  --red-soft:#f5e2dd;
  --gold:#a9783f;
  --shadow:0 1px 2px rgba(46,38,24,.04),0 10px 30px rgba(46,38,24,.06);
  --shadow-lg:0 2px 6px rgba(46,38,24,.06),0 24px 60px rgba(46,38,24,.10);
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  --r:16px;
}
[data-theme="dark"]{
  --bg:#16130d;
  --bg-soft:#1f1a12;
  --surface:#211c14;
  --surface-2:#282218;
  --ink:#ece4d4;
  --ink-2:#b3a78f;
  --ink-3:#7f7461;
  --line:#342c1e;
  --line-2:#2c2519;
  --accent:#d47768;
  --accent-soft:#3a2520;
  --green:#78b69c;
  --green-soft:#203029;
  --red:#d47768;
  --red-soft:#3a2520;
  --gold:#c79a55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::selection{background:var(--accent);color:#fff}
.app{display:flex;height:100vh}

.sidebar{width:286px;flex:0 0 286px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;gap:14px;overflow-y:auto;transition:transform .3s ease;z-index:40}
.brand{padding:6px 8px 4px}
.brand h1{font-family:var(--serif);font-size:23px;letter-spacing:2px;font-weight:700;line-height:1.25}
.brand h1 .seal{color:var(--accent)}
.brand p{font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:1px}
.search{position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.nav{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-label{font-size:11px;color:var(--ink-3);letter-spacing:2px;padding:12px 10px 4px;font-weight:600}
.nav-item{border-radius:12px;transition:background .15s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active .nav-name{color:var(--accent)}
.nav-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;width:100%;text-align:left}
.nav-row .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat,#8a7a5f) 16%,transparent);color:var(--cat,var(--ink-2))}
.nav-row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-name{flex:1;font-size:13px;font-weight:600;text-align:left}
.nav-count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 10px 50px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);transition:all .15s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.done{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.side-stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn-reset{font-size:12px;color:var(--ink-3);padding:6px;border-radius:8px;transition:color .15s,background .15s}
.btn-reset:hover{color:var(--red);background:var(--red-soft)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:18px 28px 10px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title-area h2{font-family:var(--serif);font-size:22px;letter-spacing:1px;font-weight:700}
.title-area p{font-size:13px;color:var(--ink-3);margin-top:3px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;color:var(--ink-2);transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.book-seg{border-color:var(--line)}
.book-seg button{font-weight:700;letter-spacing:1px;padding:8px 15px}
.book-seg button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.select{padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:13px;outline:none;cursor:pointer;font-weight:500}
.select:focus{border-color:var(--accent)}
.icon-toggle{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:all .18s}
.icon-toggle:hover{border-color:var(--accent);color:var(--accent)}
.icon-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);place-items:center}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.progressbar{height:3px;background:var(--line);position:relative;margin:0 28px 4px;border-radius:99px;overflow:hidden}
.progressbar #pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.content{flex:1;overflow-y:auto;padding:14px 28px 60px}

.section{margin-bottom:8px}
.section-head{display:flex;align-items:center;gap:12px;padding:18px 4px 12px}
.section-head .sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px}
.section-head .sq svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-head h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px}
.section-head .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.section-head .spacer{flex:1}
.section-head .done-badge{font-size:12px;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:99px;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s,opacity .2s;scroll-margin-top:16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat,#c9b99a);opacity:.9}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.card.mastered{opacity:.84}
.card.mastered::after{content:"已掌握";position:absolute;top:12px;right:-34px;background:var(--green);color:#fff;font-size:11px;padding:4px 36px;transform:rotate(40deg);letter-spacing:1px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-title{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.card-title h3{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.3}
.card-title h3.en{font-family:"Georgia","Times New Roman",serif;font-size:20px}
.cat-chip{font-size:11px;color:var(--cat,#8a7a5f);background:color-mix(in srgb,var(--cat,#8a7a5f) 12%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.card-actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:all .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.fav-on{color:var(--gold)}
.icon-btn.master-on{color:var(--green)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;white-space:nowrap}
.lvl0{color:var(--ink-3);background:var(--line-2)}
.lvl1{color:var(--red);background:var(--red-soft)}
.lvl2{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.lvl3{color:var(--green);background:var(--green-soft)}
.lvl4{color:#fff;background:var(--green)}
.meta{font-size:13px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tagchip{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--line-2);color:var(--ink-2);font-weight:600}

.blk{position:relative;margin:10px 0;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2)}
.blk .btag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.blk.en .btag{color:var(--accent);background:var(--accent-soft)}
.blk.ex .btag{color:var(--green);background:var(--green-soft)}
.blk.note .btag{color:var(--ink-2);background:var(--line-2)}
.btext{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--ink);text-align:justify;white-space:pre-wrap;word-break:break-word}
.blk.en .btext,.blk.ex .btext{font-family:"Georgia","Times New Roman",var(--serif)}
.blk.note .btext{font-family:var(--sans);font-size:13px;line-height:1.75;color:var(--ink-2)}
.para-note{width:100%;font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--ink);background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;outline:none;resize:vertical;min-height:38px;margin-top:4px;transition:border .2s}
.para-note:focus{border-color:var(--accent)}
.para-note::placeholder{color:var(--ink-3);font-style:italic}

.blk[data-bt]{cursor:pointer}
.blk.blurred .btext{filter:blur(7px);user-select:none;pointer-events:none}
.reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:6px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:1px;backdrop-filter:blur(2px)}
.blk.blurred .reveal{display:flex}
.reveal:hover{color:var(--accent)}

.flash-wrap{max-width:720px;margin:0 auto;padding:10px 0 40px}
.flash-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.flash-controls .pos{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.flash{perspective:1400px;cursor:pointer}
.flash-inner{position:relative;width:100%;min-height:420px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:34px 32px;display:flex;flex-direction:column}
.flash-back{transform:rotateY(180deg);overflow-y:auto}
.flash-cat{align-self:flex-start;font-size:12px;font-weight:600;color:var(--cat);background:color-mix(in srgb,var(--cat) 12%,transparent);padding:4px 12px;border-radius:99px;margin-bottom:18px}
.flash-word{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:1px;text-align:center;margin:10px 0 6px;line-height:1.4}
.flash-word.en{font-family:"Georgia","Times New Roman",serif}
.flash-hint{margin-top:auto;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:2px}
.flash-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:11px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost-green{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.btn.ghost-green:hover{border-color:var(--green)}

.quiz-wrap,.review-wrap{max-width:720px;margin:0 auto;padding:10px 0 40px}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 30px 26px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.quiz-word{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:1px;line-height:1.35}
.quiz-word.en{font-family:"Georgia","Times New Roman",serif;font-size:28px}
.quiz-cat{font-size:12px;color:var(--ink-3);margin-top:2px}
.quiz-prompt{font-size:12px;color:var(--ink-3);letter-spacing:2px;font-weight:600;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:14px}
.quiz-answer{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-height:110px;display:flex;flex-direction:column;gap:6px;justify-content:center;padding:14px}
.quiz-answer .btext{filter:blur(8px);user-select:none}
.quiz-answer.revealed .btext{filter:none}
.quiz-answer.revealed .blur-hint{display:none}
.blur-hint{font-size:13px;color:var(--ink-3);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.quiz-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.quiz-stats{display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.quiz-stats b{color:var(--green);font-variant-numeric:tabular-nums}
.review-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat-tile{flex:1;min-width:90px;text-align:center}
.stat-tile .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.stat-tile .l{font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-top:2px}
.stat-tile .n.g{color:var(--green)}.stat-tile .n.r{color:var(--accent)}.stat-tile .n.a{color:var(--gold)}
.review-head .head-ctrl{display:flex;align-items:center;gap:8px}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.show{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);max-width:580px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);font-size:16px}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:16px;letter-spacing:1px}
.share-sec{padding:14px 0;border-top:1px solid var(--line)}
.share-sec:first-of-type{border-top:none;padding-top:0}
.share-sec h4{font-size:14px;font-weight:700;margin-bottom:6px}
.share-sec p{font-size:13px;color:var(--ink-2);line-height:1.75;margin-bottom:10px}
.share-sec p b{color:var(--ink)}
.rm-word{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:1px;text-align:center;margin:14px 0 4px;line-height:1.4}
.rm-word.en{font-family:"Georgia","Times New Roman",serif}
.rm-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

.empty{max-width:480px;margin:60px auto;text-align:center;color:var(--ink-3)}
.empty .big{font-size:44px;margin-bottom:14px}
.empty h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.7;margin-bottom:16px}
.empty .btn{margin:4px}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:100;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;opacity:0;transition:opacity .3s}
.overlay.show{display:block;opacity:1}

@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .topbar{padding:14px 16px 8px}
  .content{padding:10px 16px 60px}
  .progressbar{margin:0 16px 2px}
  .grid{grid-template-columns:1fr}
  .title-area h2{font-size:19px}
  .flash-word{font-size:24px}
  .quiz-word{font-size:20px}
  .modal-card{padding:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>考研背诵卡<span class="seal">·</span>合集</h1>
      <p id="brandSub">论说文 · 23 条</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索句型 / 关键词…">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-stat"><span>已掌握</span><b id="statMastered">0 / 0</b></div>
      <div class="side-stat"><span>已收藏</span><b id="statFavs">0</b></div>
      <div class="side-stat"><span>今日已复习</span><b id="statToday">0 条</b></div>
      <button class="btn-reset" id="btnReset">清除当前科目学习进度</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
        </button>
        <div class="seg book-seg" id="bookSeg">
          <button data-book="lunshuowen">论说文</button>
          <button data-book="yingyu2">英语二</button>
          <button data-book="xiaozuowen">小作文</button>

const BOOKS = {
  lunshuowen: { key:'lunshuowen', name:'论说文', sub:'管理类联考 · 正方理由库', ls:'lunshuowen_v2', blurEn:'客观不足', blurEx:'主观优点', noteLabel:'XX · 点击填写你的分论点（自动保存）', data: [{"id":"external","name":"外部环境","full":"正方理由 · 外部环境（被需要）","group":"正方理由","color":"#5b7ca3","icon":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18\"/><path d=\"M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9z\"/>","items":[{"id":"yingjia","title":"赢家通吃","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"随着竞争边界扩大，资源与关注度向头部聚集。落后者若缺乏主动求变，极易陷入“马太效应”的恶性循环，在激烈竞争中被边缘化。"},{"k":"en","label":"主观 · 优点","text":"有助于我们把握时代机遇，也有助于积累长期优势，在不断变化的环境中实现更好的成长与发展。"}]},{"id":"xuqiu","title":"需求升级","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"当前，低端粗放的供给模式已难以匹配时代节奏。同质化竞争严重，面对大众对情绪体验、品质质感的高阶诉求，固守旧有模式不仅会造成严重的供需错配，更会让企业深陷价格战的泥潭。"},{"k":"en","label":"主观 · 优点","text":"有助于打破低端同质化的僵局，精准填补供需错配的鸿沟，从而引发用户情绪共鸣，最终提升大众的获得感与幸福感。"}]},{"id":"jishu","title":"技术变革","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"技术迭代周期不断缩短，旧模式正加速失效。固守传统优势者，极易在跨界竞争与效率碾压中陷入被动，最终被时代无情淘汰。"},{"k":"en","label":"主观 · 优点","text":"有助于打破旧有路径依赖的困局，精准填补效率洼地，从而抓住时代机遇，实现从“能做”向“做好、做极致”的质变。"}]},{"id":"xinxi","title":"信息爆炸","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"信息过载成常态，海量资讯真假交织，情绪表达常盖过事实。算法推送更让人困于信息茧房，极易引发认知迷茫。"},{"k":"en","label":"主观 · 优点","text":"有助于打破信息茧房的封闭圈，抵御情绪化舆论干扰，从而提升信息甄别力，做出清醒理性的决策。"}]},{"id":"duoyuan","title":"多元包容","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"传统刚性管控难以为继。随着平等意识觉醒，依靠权威发号施令往往不再有效，反而极易导致人才流失与团队涣散。"},{"k":"en","label":"主观 · 优点","text":"有助于脱离刚性约束的困境，填补尊重需求的空缺，从而唤醒个体自觉，凝聚起强大的团队合力。"}]},{"id":"shidai","title":"时代趋势","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"随着当前宏观环境深刻变革，人口红利逐渐消退，高耗能模式逐遭淘汰。旧思路难以应对新的变化，固守老路往往会被市场淘汰。"},{"k":"en","label":"主观 · 优点","text":"有助于打破旧有路径依赖，精准规避合规风险，从而在变局中把握机遇，实现高质量的长远发展。"}]}]},{"id":"internal","name":"内部短板","full":"正方理由 · 内部短板（被需要）","group":"正方理由","color":"#a9783f","icon":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><line x1=\"12\" y1=\"7\" x2=\"12\" y2=\"13\"/><circle cx=\"12\" cy=\"16.5\" r=\"0.5\" fill=\"currentColor\"/>","items":[{"id":"siwei","title":"思维陈旧","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"过去的成功极易形成路径依赖，思维定式让人习惯用旧经验解决新问题。一旦环境改变，经验主义便会引发认知偏差，最终导致竞争力丧失。"},{"k":"en","label":"主观 · 优点","text":"有助于打破路径依赖，矫正认知偏差，从而跳出经验陷阱，在变革中重塑核心竞争力。"}]},{"id":"nengli","title":"能力不足","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"任何主体都难面面俱到。专业欠缺、资源匮乏等短板，易让人陷入“心有余而力不足”的困境，盲目闭门造车只会错失良机。"},{"k":"en","label":"主观 · 优点","text":"有助于打破资源匮乏的瓶颈，填补专业欠缺的短板，从而扬长避短，实现借力破局与长远发展。"}]},{"id":"pingjing","title":"瓶颈太多","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"发展常遇瓶颈，增长放缓、创新乏力、资源错配交织。原有模式触及天花板，若安于现状便会陷入停滞与内卷化。"},{"k":"en","label":"主观 · 优点","text":"有助于打破原有模式的天花板，填补资源错配与创新乏力的短板，从而破除内卷，实现破局升级。"}]}]},{"id":"self","name":"对自身","full":"正方理由 · 对自身（有好处）","group":"正方理由","color":"#4a8a6f","icon":"<path d=\"M6 3h12l4 6-10 12L2 9z\"/><path d=\"M2 9h20M12 3l-2 6 2 12 2-12-2-6\"/>","items":[{"id":"hexin","title":"核心竞争力","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"市场同质化严重，价格战激烈。缺乏独特优势极易陷入低水平内卷，利润空间被严重挤压，难获发展主动权。"},{"k":"en","label":"主观 · 优点","text":"有助于摆脱低价竞争的泥潭，打破缺乏独特优势的僵局，从而构筑差异化壁垒，实现长远发展。"}]},{"id":"jiangben","title":"降本增效","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"原材料上涨、人力成本增加，管理效率低下。粗放式的“人海战术”难以为继，利润空间被严重挤压，缺乏持续竞争力。"},{"k":"en","label":"主观 · 优点","text":"有助于打破粗放增长的困局，填补管理效率低下的短板，从而提升人效，在激烈竞争中夯实生存根基。"}]},{"id":"jingjin","title":"专业精进","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"行业追风口、炒概念，人心浮躁。“样样通、样样松”的万金油模式难以为继，极易在激烈竞争中被替代。"},{"k":"en","label":"主观 · 优点","text":"有助于打破浮躁跟风的困局，填补缺乏核心竞争力的短板，从而在洗牌中站稳脚跟，实现长远发展。"}]},{"id":"xinren","title":"信任资本","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"缺乏信任则交易成本高企，合作机会锐减。主体间互相防备，极易陷入内耗，难以形成稳定的协作关系。"},{"k":"en","label":"主观 · 优点","text":"有助于打破信任缺失的壁垒，填补合作匮乏的短板，从而积累口碑，赢得用户长期信任。"}]},{"id":"pinpai","title":"品牌资产","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"同质化竞争严重，产品易被模仿。缺乏品牌资产，极易陷入低价泥潭，无法建立用户偏好，难以获取长期溢价。"},{"k":"en","label":"主观 · 优点","text":"有助于打破同质化替代的困局，填补情感连接的缺失，从而占领用户心智，构筑品牌护城河。"}]},{"id":"nianxing","title":"用户粘性","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"市场竞争加剧，获客成本日益高昂。单靠粗放式“拉新”难以为继，缺乏黏性极易导致用户流失，难以持续增长。"},{"k":"en","label":"主观 · 优点","text":"有助于打破流量枯竭的困局，填补信任与情感连接的缺失，从而提升复购，实现长期价值增长。"}]},{"id":"fangxian","title":"防范风险","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"不确定性是常态，政策波动与“黑天鹅”事件频发。无视规则、盲目扩张、布局单一，表面提升效率，实则留下隐患。"},{"k":"en","label":"主观 · 优点","text":"有助于打破盲目扩张的隐患，填补风控缺失的短板，从而筑牢防线，实现长远发展。"}]},{"id":"changqi","title":"长期主义","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"短期主义追逐眼前利益，忽视长远布局。缺乏战略定力极易陷入被动，遭遇波动便难以为继，最终被市场淘汰。"},{"k":"en","label":"主观 · 优点","text":"有助于打破短视逐利的被动困局，填补长远布局的缺失，从而锚定目标穿越周期，赢得长远未来。"}]}]},{"id":"team","name":"对团队","full":"正方理由 · 对团队（有好处）","group":"正方理由","color":"#7a6aa3","icon":"<path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>","items":[{"id":"jili","title":"激励人心","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"人才竞争激烈，仅靠薪酬难留人。缺乏尊重与认可，极易导致人才流失，沦为被动执行者，难以激发组织活力。"},{"k":"en","label":"主观 · 优点","text":"有助于打破单靠物质激励的局限，填补尊重与自我实现的缺失，从而增强归属感，让人才从“要我干”转向“我要干”。"}]},{"id":"ningju","title":"凝聚团队","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"团队涣散，内耗严重。个人能力虽强却难成合力，导致沟通与信任成本高企，严重限制团队上限，陷入被动服从。"},{"k":"en","label":"主观 · 优点","text":"有助于打破涣散困局，填补信任缺失，从而增强归属感，实现从“被动服从”向“主动认同”的飞跃。"}]},{"id":"jisi","title":"集思广益","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"封闭环境扼杀创新，个体思考存在局限。单一视角易形成认知盲区，主观判断易生偏差，单打独斗难破思维固化。"},{"k":"en","label":"主观 · 优点","text":"有助于打破思维固化的局限，填补单一视角的盲区，从而激发集体智慧，营造创新氛围。"}]}]},{"id":"society","name":"对社会","full":"正方理由 · 对社会（有好处）","group":"正方理由","color":"#bb5a4a","icon":"<line x1=\"3\" y1=\"22\" x2=\"21\" y2=\"22\"/><line x1=\"6\" y1=\"18\" x2=\"6\" y2=\"11\"/><line x1=\"10\" y1=\"18\" x2=\"10\" y2=\"11\"/><line x1=\"14\" y1=\"18\" x2=\"14\" y2=\"11\"/><line x1=\"18\" y1=\"18\" x2=\"18\" y2=\"11\"/><polygon points=\"12 2 20 7 4 7\"/>","items":[{"id":"yinling","title":"引领行业","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"市场若只以低价论成败，用心做品质者便失去动力。低标准竞争引发恶性循环，最终无人独善其身，共同承受行业衰败代价。"},{"k":"en","label":"主观 · 优点","text":"有助于打破低标准内卷的困局，填补正向价值指引的缺失，从而重塑行业生态，带动社会共同进步。"}]},{"id":"shengtai","title":"生态共建","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"单打独斗的零和博弈已难以为继。恶性竞争消耗行业整体价值，陷入价格战怪圈，最终削弱所有人的生存空间。"},{"k":"en","label":"主观 · 优点","text":"有助于打破零和博弈的困局，填补内部消耗的短板，从而赋能生态伙伴，实现共生共赢与良性循环。"}]},{"id":"shehui","title":"社会责任","meta":"","tags":[],"blocks":[{"k":"en","label":"客观 · 不足","text":"企业若只追求经济利益而忽视社会责任，无异于社会“毒瘤”。极易导致公众信任缺失，恶化社会风气，最终被市场抛弃，难以长远发展。"},{"k":"en","label":"主观 · 优点","text":"有助于打破只顾逐利的困局，填补公众信任的缺失，从而实现商业价值与社会价值的统一。"}]}]}] },
  yingyu2:    { key:'yingyu2', name:'英语二作文', sub:'图表作文模板 + 图表描述词汇', ls:'yingyu2_v1', blurEn:'模板句', blurEx:'例句', noteLabel:'✎ 我的笔记（记忆点 / 替换词，自动保存）', data: [{"id":"p1","name":"第一段·图表描述","full":"图表作文 · 第一段（3句）","group":"作文模板","color":"#5b7ca3","icon":"<line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"10\"/><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"16\"/>","items":[{"id":"p1-3y","title":"三年以上数据图表","meta":"第一段 ① · 柱状图 / 折线图","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Illustrated in the chart above are these statistics: XXX. From [Y1] to [Y2], the number of [A] increased // decreased remarkably from only about [D1] to [D2]. Meanwhile the amount // number of [B], surpassing expectations // beyond expectations, swelled // dipped dramatically from [D3] to [D4]."},{"k":"note","label":"注意","text":"① 注意时态：图表描述过去年份的数据，一律用一般过去时。② 表示数量的词注意可数/不可数：number 接可数名词、amount 接不可数。③ 开头万能句：As is illustrated in the chart above, …（最常用）；Illustrated in the chart above are …（倒装，加分）。"}]},{"id":"p1-table","title":"表格数据（静态）","meta":"第一段 ② · 表格","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Illustrated in the chart above are these statistics: XXX. Among those who [A], the proportion of people [P1] is the largest, accounting for [D1]. Meanwhile the proportions of [B] equal for [P1] and [P3], at roughly [D2]. In contrast, [C] is [D3] or so, among those [P2], the maximum value among all these categories."},{"k":"note","label":"注意","text":"静态表格：先抓最大值，再写相等的两项，最后点出最大项；占比用 account for / proportion 表达。"}]},{"id":"p1-2y","title":"两年数据图表","meta":"第一段 ③ · 柱状图 / 折线图","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Illustrated in the chart above are these statistics: XXX. In [Y1], [B] topped the three [ZT], while in [Y2], a remarkable decline // increase of [D1] occurred, from [D2] to [D3]. By contrast, there was a noticeable jump // decrease of [D4] from [D5] to [D6] during the same period in [A], and C stayed at the same level of [D7]."},{"k":"note","label":"注意","text":"两年对比：先写第一年最高项，再写第二年变化，用 By contrast 引出另一项，最后写持平项。"}]},{"id":"p1-notime","title":"无时间维度图表","meta":"第一段 ④ · 柱状图 / 饼状图","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Illustrated in the chart above are these statistics: XXX. The percentage of [A] is the highest among all the [ZT] categories, at approximately [D1], whereas [B], [C], [D] and others account for [D2], [D3], [D4], and [D5] respectively."},{"k":"note","label":"注意","text":"无时间维度（占比型）：先写最大占比，再用 whereas 逐一列出其余各项占比。"}]}]},{"id":"p2","name":"第二段·万能原因","full":"图表作文 · 第二段（3、4句）","group":"作文模板","color":"#a9783f","icon":"<polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/>","items":[{"id":"p2-trans","title":"万能原因过渡句","meta":"第二段 · 主题句开头","tags":[],"blocks":[{"k":"en","label":"模板句","text":"The fundamental factors that contribute to the tendency may be expounded as follows."},{"k":"en","label":"论述连接词","text":"① To begin with, … ② Moreover, … ③ Subsequently, … ④ Ultimately, …"},{"k":"note","label":"注意","text":"论述连接词的选择要注意递进关系：To begin with → Moreover → Subsequently → Ultimately。"}]},{"id":"p2-tech","title":"① 社会之经济科技","meta":"万能原因 ① · 经济科技","tags":[],"blocks":[{"k":"en","label":"第一句 · 1","text":"Hardly a week goes by without notable advances in technology and society——progress that would have seemed incredible many years ago."},{"k":"en","label":"第一句 · 2","text":"Karl Marx once said: The economic base determines the superstructure."},{"k":"en","label":"第一句 · 3","text":"Coincident with the growing quantity of information is the development of technologies which enable the delivery of more information with greater speed to more locations than has ever been possible before."},{"k":"en","label":"第二句 · 负面","text":"Amidst the fast-paced advancement of the world, many people, if not most, are becoming increasingly ________, triggering ________."},{"k":"en","label":"第二句 · 正面","text":"Amidst the fast-paced advancement of the world, many people, if not most, are becoming increasingly ________, which provides them with a fundamental economic basis for doing sth."},{"k":"ex","label":"举例","text":"Coincident with an age of thriving economic progress is our present life——these improvements have significantly quickened people's life-pace.\nAmidst the fast-developing world, many people, if not most, are becoming increasingly result-oriented and impatient, triggering a rise in procrastination."}]},{"id":"p2-global","title":"② 经济全球化、都市化","meta":"万能原因 ② · 全球化/都市化","tags":[],"blocks":[{"k":"en","label":"正面","text":"The human race having entered a completely new stage in its history marked by accelerating economic globalization and urbanization（这里可以根据题干补充说明）, the necessity of [主题词] is brought to our attention."},{"k":"en","label":"负面","text":"The human race having entered a completely new stage in its history marked by great strain and intense competition（这里可以根据题干补充说明）, we are now confronted with numerous problems, including those mentioned above（不好的问题，可替换为具体内容）."},{"k":"ex","label":"举例","text":"The human race having entered a completely new stage in its history marked by great strain and intense competition——individuals lacking comprehensive knowledge are deemed uncompetitive, the necessity of developing all-rounded individuals is brought to our attention."}]},{"id":"p2-thought","title":"⑤ 社会思想转变","meta":"万能原因 ⑤ · 思想转变","tags":[],"blocks":[{"k":"en","label":"句 1","text":"The tendency has been closely associated with the shift in folks' perspectives on [主题词]. Put differently, the fact that [主题词的反义词] is no longer as essential as it used to be demonstrates that what truly matters now is [现在人们觉得什么重要]."},{"k":"en","label":"句 2","text":"What has come to matter are [与主题词有关的名词1] and [与主题词有关的名词2]. In contrast, [与主题词相反的名词] has/have been degraded to the margin."},{"k":"ex","label":"举例","text":"With the rapid social and cultural progress, what has come to matter are cultural immersion, historical exploration and intellectual enrichment. In contrast, immediate material benefits have been degraded to the margin. This shift explains why more people are visiting museums."}]},{"id":"p2-culture","title":"⑥ 文化的多样性/包容性","meta":"万能原因 ⑥ · 文化包容","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Due to the inclusiveness of culture, there are many options facing every person——and some of them choose the very way of doing sth."},{"k":"ex","label":"举例","text":"Due to the inclusiveness of culture, there are many options facing every graduate——and some of them choose the very way of pursuing postgraduate studies, seeking jobs, starting businesses or studying abroad."}]},{"id":"p2-gov","title":"⑦ 政府、学校","meta":"万能原因 ⑦ · 政府/学校","tags":[],"blocks":[{"k":"en","label":"负面","text":"The local administrations/universities, failing to enact some well-enforced laws and regulations/play a crucial role, make it harder to deeply practice the concept of xx (balance/innovation/mutual assistance) conveyed by the drawing/chart, and make xx (the implementation of the concept/the transmission of values) hollow words."},{"k":"en","label":"正面","text":"The local administrations/universities, by exerting effective and strict supervision on sth/enacting some well-enforced laws and regulations/playing a crucial role in enhancing these ideas showed in the drawing/chart/investing heavily in..., make it possible for us to deeply practice the concept of xx (balance/innovation/mutual assistance) conveyed by the drawing/chart, and make xx (the implementation of the concept/the transmission of values) a reality."},{"k":"ex","label":"举例","text":"The local administrations, by enacting some well-enforced supportive policies and investing heavily in startup funds for young people, make it possible for college students to deeply practice the concept of innovation conveyed by the drawing, and make the implementation of entrepreneurship a reality."}]},{"id":"p2-media","title":"⑧ 多媒体","meta":"万能原因 ⑧ · 多媒体","tags":[],"blocks":[{"k":"en","label":"句 1","text":"All kinds of media channels, be they newspapers or the Internet, vigorously advocate that what really matters is/helps us avoid setbacks is [媒体宣传对象/主题词], encouraging people to do sth."},{"k":"en","label":"句 2","text":"All kinds of media channels, be they newspapers or the Internet, vigorously advocate that what really makes us happy is not [主题词反面] but [媒体宣传对象/主题词], encouraging people to do sth."},{"k":"en","label":"句 3","text":"People are in an atmosphere which values [主题词], and the mass media offer numerous reports and interviews. Therefore, unsurprisingly, people choose to do sth."},{"k":"ex","label":"举例","text":"All kinds of media channels, be they newspapers or the Internet, vigorously advocate that what really matters to us is physical health rather than blind pursuit of material gains, encouraging people to keep fit regularly."}]}]},{"id":"p3","name":"第三段·结尾","full":"图表作文 · 第三段（3、4句）","group":"作文模板","color":"#4a8a6f","icon":"<path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><line x1=\"4\" y1=\"22\" x2=\"4\" y2=\"15\"/>","items":[{"id":"p3-good","title":"【好】正面总结","meta":"第三段 ① · 好","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Altogether, [主题词] is deemed not only a catalyst for the success of sth but also a bedrock/cornerstone of social progress."}]},{"id":"p3-neutral","title":"【中性、静态图】","meta":"第三段 ② · 中性/静态","tags":[],"blocks":[{"k":"en","label":"模板句","text":"In conclusion, [主题词] is a subjective/sensory experience for today's individuals/dwellers/folks/undergraduates/graduates/postgraduates as what they focus on/concentrate on/place emphasis on are the factors affecting the whole/overall experience, an insight that should be held in high regard by [xx产业]（没有产业就直接写 society）."}]},{"id":"p3-trend","title":"【趋势、动态图】","meta":"第三段 ③ · 趋势/动态","tags":[],"blocks":[{"k":"en","label":"模板句","text":"This trend, against the backdrop of the economic boom in China, will probably become dominant in the foreseeable future/will not be reversed radically in the near future/is likely to persist in the foreseeable future."}]},{"id":"p3-warn","title":"【褒贬色彩主旨】","meta":"第三段 ④ · 褒贬","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Without a clear understanding of the current situation, we would be between a rock and a hard place."}]},{"id":"p3-sword","title":"【双刃剑】","meta":"第三段 ⑤ · 双刃剑","tags":[],"blocks":[{"k":"en","label":"模板句","text":"Equipped with intellect, caution, and discernment, people will not only navigate around the pitfalls of [主题词] but also unlock its full potential."}]}]},{"id":"vt","name":"图表类型","full":"词汇 · 图表本身怎么称呼","group":"图表词汇","color":"#7a6aa3","icon":"<path d=\"M21.21 15.89A10 10 0 1 1 8 2.83\"/><path d=\"M22 12A10 10 0 0 0 12 2v10z\"/>","items":[{"id":"vt-chart","title":"chart","meta":"n. 图表（总称）","tags":[],"blocks":[{"k":"note","label":"用法","text":"泛指一切图表，最安全、最通用的说法；英语二题干凡提到图形，几乎都写 chart。柱状图、饼状图、折线图、表格均可统称 chart，不会扣分。拿不准具体类型时，一律写 chart 最稳。"},{"k":"ex","label":"例句","text":"Illustrated in the chart above are the changes in residents' reading habits."}]},{"id":"vt-graph","title":"graph","meta":"n. 图表、曲线图","tags":[],"blocks":[{"k":"note","label":"用法","text":"特指由坐标轴构成的图；强调「趋势/曲线」时用 graph 更精准；饼状图不能叫 graph。"},{"k":"ex","label":"例句","text":"The graph shows how the number of cyclists rose between 2010 and 2020."}]},{"id":"vt-table","title":"table","meta":"n. 表格","tags":[],"blocks":[{"k":"note","label":"用法","text":"只用于「表格」题型；题干给的是行列数据表时，必须写 table，不能写 chart。"},{"k":"ex","label":"例句","text":"The table compares the proportions of students joining different clubs."}]},{"id":"vt-bar","title":"bar chart","meta":"n. 柱状图","tags":[],"blocks":[{"k":"note","label":"用法","text":"题干明确是柱状时写，属加分项；用于「比较大小/高低」的柱状图。"},{"k":"ex","label":"例句","text":"The bar chart compares the sales of three products."}]},{"id":"vt-pie","title":"pie chart","meta":"n. 饼状图","tags":[],"blocks":[{"k":"note","label":"用法","text":"题干明确是饼图时写；用于「占比构成」的饼图。"},{"k":"ex","label":"例句","text":"The pie chart shows the choices made by college graduates."}]},{"id":"vt-line","title":"line graph","meta":"n. 折线图","tags":[],"blocks":[{"k":"note","label":"用法","text":"题干明确是折线时写；用于「趋势变化」的折线图。"},{"k":"ex","label":"例句","text":"The line graph illustrates the rising trend of online shopping."}]}]},{"id":"vv","name":"呈现/显示动词","full":"词汇 · 图表「呈现/显示」动词","group":"图表词汇","color":"#bb5a4a","icon":"<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","items":[{"id":"vv-illustrate","title":"illustrate","meta":"v. 说明、阐明","tags":["过去式 illustrated（规则）"],"blocks":[{"k":"note","label":"用法","text":"开头最常用，主语是「图表」；书面、正式，几乎万能。搭配：As is illustrated in the chart, ...。注意：illustrate 强调「用图表说明事实」，不是「图画」本身。"},{"k":"ex","label":"例句","text":"The chart illustrated that the number of gym members doubled."}]},{"id":"vv-show","title":"show","meta":"v. 显示","tags":["过去式 showed（不规则）"],"blocks":[{"k":"note","label":"用法","text":"最通用的显示动词；任何图表、任何数据。最安全但略平淡，冲高分可换 illustrate/depict。"},{"k":"ex","label":"例句","text":"The pie chart showed that employment was the top choice."}]},{"id":"vv-display","title":"display","meta":"v. 展示","tags":["过去式 displayed（规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「把数据摆出来」的动作；同 show，语气略正式。"},{"k":"ex","label":"例句","text":"The table displayed the results of the survey."}]},{"id":"vv-demonstrate","title":"demonstrate","meta":"v. 证明、表明","tags":["过去式 demonstrated（规则）"],"blocks":[{"k":"note","label":"用法","text":"当图表数据能「证明」某结论时用；语气比 show 强，适合揭示明显规律；demonstrate 后常接「结论/观点」。"},{"k":"ex","label":"例句","text":"The data demonstrated a clear upward trend."}]},{"id":"vv-depict","title":"depict","meta":"v. 描绘","tags":["过去式 depicted（规则）"],"blocks":[{"k":"note","label":"用法","text":"as is depicted in ...；偏「图画式」描述，图表可用但不如 illustrate 高频。"},{"k":"ex","label":"例句","text":"The chart depicted the distribution of graduates' choices."}]},{"id":"vv-reveal","title":"reveal / reflect","meta":"v. 揭示 / 反映","tags":["过去式 revealed / reflected（规则）"],"blocks":[{"k":"note","label":"用法","text":"第二段引出「图表反映的社会现象」时用；reveal 揭示隐藏事实；reflect 反映背后的问题/趋势。"},{"k":"ex","label":"例句","text":"The chart revealed a shift in people's reading habits."}]}]},{"id":"vu","name":"上升动词","full":"词汇 · 上升动词","group":"图表词汇","color":"#2f8f8b","icon":"<polyline points=\"23 6 13.5 15.5 8.5 10.5 1 18\"/><polyline points=\"17 6 23 6 23 12\"/>","items":[{"id":"vu-increase","title":"increase","meta":"v./n. 增加、增长","tags":["过去式 increased（规则）"],"blocks":[{"k":"note","label":"用法","text":"最通用、最安全的上升动词；数量、数值、比例、程度、规模均可。搭配：increase from X to Y / increase by X% / increase to Y。注意：by 后接「增长量」，to 后接「终值」。"},{"k":"ex","label":"例句","text":"The number of residents doing exercise increased from 2 to 4.8 million."}]},{"id":"vu-rise","title":"rise","meta":"v./n. 上升","tags":["过去式 rose / risen（不规则）"],"blocks":[{"k":"note","label":"用法","text":"多指「水平/数量」自然上升；价格、数量、比例上升。注意：不及物；区分 raise（及物）。"},{"k":"ex","label":"例句","text":"The figure rose sharply from 30% to 45%."}]},{"id":"vu-grow","title":"grow","meta":"v./n. 增长（growth）","tags":["过去式 grew / grown（不规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「逐渐增长、发展壮大」；经济、人口、市场、行业。搭配：grow from X to Y / grow by X%。"},{"k":"ex","label":"例句","text":"The online market grew steadily over the decade."}]},{"id":"vu-climb","title":"climb","meta":"v. 攀升","tags":["过去式 climbed（规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「逐步、持续爬升」；数值、价格、排名。"},{"k":"ex","label":"例句","text":"The rate climbed gradually from 20% to 35%."}]},{"id":"vu-soar","title":"soar","meta":"v. 猛增、飙升","tags":["过去式 soared（规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「快速、大幅上升」；价格、销量、数量；不适合小幅增长。"},{"k":"ex","label":"例句","text":"House prices soared by 30% in five years."}]},{"id":"vu-surge","title":"surge","meta":"v./n. 激增、猛涨","tags":["过去式 surged（规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「突然、迅猛上升」；需求、人数、销量等短期暴涨。"},{"k":"ex","label":"例句","text":"The demand for online courses surged during the period."}]},{"id":"vu-jump","title":"jump","meta":"v./n. 跃升","tags":["过去式 jumped（规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「跳跃式上升」。"},{"k":"ex","label":"例句","text":"The number jumped from 1 million to 3 million."}]},{"id":"vu-swell","title":"swell","meta":"v. 膨胀、增多","tags":["过去式 swelled / swollen（不规则）"],"blocks":[{"k":"note","label":"用法","text":"强调「像膨胀一样扩大」；数量、规模、人数扩大。注意：swelled / swollen 拼写易错。"},{"k":"ex","label":"例句","text":"The number of smartphone users swelled dramatically."}]}]},{"id":"va","name":"程度副词","full":"词汇 · 程度副词","group":"图表词汇","color":"#4a7ba6","icon":"<polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/>","items":[{"id":"va-dramatically","title":"dramatically","meta":"adv. 戏剧性地、大幅地","tags":[],"blocks":[{"k":"note","label":"用法","text":"程度最强烈，配「暴涨/暴跌」。"},{"k":"ex","label":"例句","text":"The number rose dramatically."}]},{"id":"va-remarkably","title":"remarkably","meta":"adv. 显著地、惊人地","tags":[],"blocks":[{"k":"note","label":"用法","text":"强调「明显到引人注目」。"},{"k":"ex","label":"例句","text":"The figure increased remarkably."}]},{"id":"va-sharply","title":"sharply","meta":"adv. 急剧地","tags":[],"blocks":[{"k":"note","label":"用法","text":"常用「价格」的陡增陡降。"},{"k":"ex","label":"例句","text":"Prices rose sharply."}]},{"id":"va-significantly","title":"significantly","meta":"adv. 显著地","tags":[],"blocks":[{"k":"note","label":"用法","text":"最通用、最安全的程度副词。"},{"k":"ex","label":"例句","text":"The figure increased significantly."}]},{"id":"va-substantially","title":"substantially / considerably","meta":"adv. 大幅地、可观地","tags":[],"blocks":[{"k":"note","label":"用法","text":"书面、正式，配「较大幅度变化」。"},{"k":"ex","label":"例句","text":"Sales grew substantially last year."}]},{"id":"va-rapidly","title":"rapidly","meta":"adv. 快速地","tags":[],"blocks":[{"k":"note","label":"用法","text":"强调「速度」，不强调幅度。"},{"k":"ex","label":"例句","text":"The market expanded rapidly."}]},{"id":"va-gradually","title":"gradually / steadily","meta":"adv. 逐渐地 / 稳步地","tags":[],"blocks":[{"k":"note","label":"用法","text":"配「平缓、持续」的变化。"},{"k":"ex","label":"例句","text":"The proportion increased steadily."}]},{"id":"va-slightly","title":"slightly / moderately","meta":"adv. 轻微地 / 适度地","tags":[],"blocks":[{"k":"note","label":
